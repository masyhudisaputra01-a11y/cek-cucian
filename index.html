<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7d8c">
<meta name="description" content="Catat dan foto baju sebelum dibawa ke laundry, lalu cocokkan saat diambil.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cek Cucian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: satu kolom ala nota laundry — daftar kiriman, lalu detail dengan tab Catatan / Cek ambil */
:root{
  --bg:#eef3f4; --paper:#ffffff; --ink:#15272d; --muted:#5c7178; --line:#d3dfe2;
  --accent:#0f7d8c; --accent-ink:#ffffff; --accent-soft:#d9eef1;
  --tag:#f7d55c; --tag-ink:#3d3205;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --bad:#c2412d; --bad-soft:#fbe3de; --wait:#9a6b00; --wait-soft:#fbefcc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sub{margin:6px 0 20px;color:var(--muted);max-width:60ch}
.note{font-size:.85rem;padding:10px 14px;border-radius:10px;background:var(--wait-soft);color:var(--ink);margin-bottom:16px}

/* nota card */
.list{display:grid;gap:14px}
.nota{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;color:inherit;width:100%}
.nota:hover{border-color:var(--accent)}
.hang{width:54px;min-height:64px;background:var(--tag);color:var(--tag-ink);border-radius:8px 8px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding-top:10px;font-family:var(--f-mono);font-size:.7rem;text-align:center;line-height:1.2}
.hang::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--paper)}
.hang b{font-size:1.25rem;font-family:var(--f-display);font-weight:800}
.nota .meta{min-width:0}
.nota .meta h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nota .meta p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty svg{width:64px;height:64px;color:var(--accent)}
.empty ol{text-align:left;margin:4px 0 8px;padding-left:20px;color:var(--muted);max-width:42ch}

/* detail */
.back{margin:-6px 0 10px -8px}
.head-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.facts div{min-width:0}
.facts .v{font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.item.st-ok{border-color:var(--ok)}
.item.st-bad{border-color:var(--bad)}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:6px}
.thumb svg{width:30px;height:30px}
.item .body{min-width:0;display:grid;gap:4px}
.item .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .desc{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.qty{font-family:var(--f-mono);font-weight:500;background:var(--bg);border-radius:8px;padding:2px 8px;font-size:.85rem}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.checks .btn{padding:7px 12px;font-size:.85rem}
.checks .btn.on-ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.checks .btn.on-bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.issue{font-size:.85rem;color:var(--bad);overflow-wrap:anywhere}
.summary{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;margin-bottom:14px}
.summary.ok{background:var(--ok-soft)}
.summary.bad{background:var(--bad-soft)}
.summary.wait{background:var(--accent-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px;font-size:.9rem;color:var(--muted)}

/* fab */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:20;box-shadow:0 6px 20px rgba(15,60,70,.25);padding:14px 20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.stepper input{width:70px;text-align:center}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:84px;height:84px;border-radius:10px;overflow:hidden;position:relative;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem;line-height:1}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:600}
.addph svg{width:24px;height:24px}
.ph.loading::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:1.4rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:calc(14px + env(safe-area-inset-right, 0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
.backup{margin-top:32px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.backup p{margin:4px 0 0;font-size:.88rem;max-width:60ch}
.backup-due{display:grid;gap:10px;justify-items:start}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---- Tampilan HP v2 ---- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.wrap{padding-block:16px 130px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:720px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo svg{width:22px;height:22px}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.1;letter-spacing:-.01em}
.brand-s{font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;flex:none}
@media (max-width:370px){.brand-s{display:none}}
.pagehead{display:grid;gap:2px;margin:6px 0 14px}
.pagehead h1{font-size:1.6rem}
.pagehead p{margin:0;font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.stats b{font-family:var(--f-display);font-size:1.55rem;font-weight:800;line-height:1.1}
.stats span{font-size:.72rem;color:var(--muted);line-height:1.25}
.stats .warn{background:var(--bad-soft);border-color:transparent}
.stats .warn b{color:var(--bad)}
.label{margin-bottom:2px}
.list{gap:10px}
.nota{padding:14px;gap:12px;box-shadow:0 1px 2px rgba(10,40,50,.05);transition:transform .12s, border-color .12s}
.nota .meta h3{font-size:1rem}
.nota .meta p{font-size:.8rem}
.btn{min-height:44px;transition:transform .12s, background .12s}
.nota:active,.btn:active{transform:scale(.98)}
.back{min-height:40px}
.head-card{padding:0;gap:0;overflow:hidden;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.head-card > .row{background:var(--accent);color:var(--accent-ink);padding:16px 18px 18px;position:relative}
.head-card > .row .label{color:inherit;opacity:.8}
.head-card > .row::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 6px,var(--paper) 4px,transparent 4.5px) 0 0/16px 12px repeat-x}
.head-card > .row .chip{background:var(--paper)}
.head-card > *:not(.row){margin:0 18px}
.head-card > .facts{margin-top:20px}
.head-card > p{margin-top:14px !important}
.head-card > div:last-child:not(.facts){margin-top:14px;margin-bottom:16px}
.head-card > .facts:last-child,.head-card > p:last-child{margin-bottom:18px !important}
.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:620px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:20;box-shadow:0 4px 14px rgba(10,40,50,.08)}
.tabs button{min-height:40px}
.item{grid-template-columns:84px 1fr;padding:12px;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.item.st-ok{background:linear-gradient(var(--ok-soft),var(--ok-soft)) left/4px 100% no-repeat,var(--paper)}
.item.st-bad{background:linear-gradient(var(--bad-soft),var(--bad-soft)) left/4px 100% no-repeat,var(--paper)}
.thumb{width:84px;height:84px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks .btn{min-height:42px;padding:8px 10px}
.summary h3{font-size:1.05rem}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(10,40,50,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.bb-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.bb-in .btn{flex:1;min-height:48px;font-size:.95rem}
.bb-prog{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.bb-prog b{color:var(--ink);font-family:var(--f-mono)}
.bb-prog .bar{margin-top:6px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input[type=text],input[type=number],input[type=date],textarea{font-size:16px;min-height:46px}
.sheet{padding-top:0;gap:16px}
.sheet .sh{position:sticky;top:0;z-index:3;background:var(--paper);margin:0 -18px;padding:22px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .sh::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet .sh h2{font-size:1.2rem}
.sheet > .btn:last-child,.sheet > .actions:last-child{position:sticky;bottom:0;z-index:3;box-shadow:0 -14px 14px var(--paper)}
.sheet > .btn:last-child{width:100%;min-height:50px}
.sheet > .actions:last-child{background:var(--paper);padding-block:8px 0}
.sheet > .actions:last-child .btn{flex:1;min-height:50px}
.presets button{min-height:38px}
.empty{padding:32px 20px;box-shadow:none}
.empty .lead{margin:0;color:var(--muted);max-width:40ch}
@media (prefers-reduced-motion:reduce){.nota,.btn{transition:none}.nota:active,.btn:active{transform:none}}
/* ---- Fitur pelanggan v3 ---- */
input[type=tel]{font:inherit;font-size:16px;min-height:46px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.small{font-size:.8rem}
.field small{font-size:.78rem}
.iconbtn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.chip.draft{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.due{background:var(--accent);color:var(--accent-ink)}
.nota .side{display:grid;gap:6px;justify-items:end}
.nota.is-due{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lockmini{color:var(--muted);display:inline-flex}
.lockmini svg{width:16px;height:16px}
.label.sec{margin:22px 0 10px}
.pagehead + .stats + .label.sec,.pagehead + .stats + .alert{margin-top:0}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.alert svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:1px}
.alert b{display:block}
.alert span{font-size:.85rem;color:var(--muted)}
.backup-due{margin-top:12px}
.hero-empty{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:grid;gap:12px;justify-items:center;text-align:center;margin-top:8px}
.hero-empty h2{font-size:1.45rem}
.hero-empty .lead{margin:0;color:var(--muted);max-width:40ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-bottom:6px}
.steps3 div{background:var(--bg);border-radius:12px;padding:12px 8px;display:grid;gap:4px;justify-items:center}
.steps3 span{width:28px;height:28px;border-radius:50%;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.steps3 b{font-size:.82rem;line-height:1.2}
.steps3 small{font-size:.7rem;color:var(--muted);line-height:1.2}
.btn.big{width:100%;min-height:52px;font-size:1rem}

const fmtDate=s=>{if(!s)return"–";const d=new Date(s+"T00:00:00");if(isNaN(d))return s;return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})};

const ICON={

/* ================= Penyimpanan ================= */
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{const r=indexedDB.open("cekcucian",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("foto"))d.createObjectStore("foto");if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
async function idbDo(mode,fn,st="foto"){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const s=t.objectStore(st);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const store={batches:[],cache:new Map(),mode:"local"};
function load(){try{store.batches=JSON.parse(lsGet(LS_KEY,"[]"))||[]}catch(e){store.batches=[]}}
function persist(){if(!lsSet(LS_KEY,JSON.stringify(store.batches))){toast("Memori browser penuh. Hapus kiriman lama atau cadangkan lalu bersihkan.");return false}return true}
function saveBatch(b){b.diubah=Date.now();const i=store.batches.findIndex(x=>x.id===b.id);if(i<0)store.batches.unshift(b);else store.batches[i]=b;if(store.mode==="cloud")cloudWrite(b);else persist();render()}
function allRefs(b){const r=[...(b.fotoUmum||[])];for(const it of b.items||[]){r.push(...(it.foto||[]),...(it.cekFoto||[]))}return r}
async function deleteBatch(b){store.batches=store.batches.filter(x=>x.id!==b.id);if(store.mode==="cloud")userCol("kiriman").doc(b.id).delete().catch(e=>toast("Gagal menghapus: "+fbErr(e)));else persist();for(const r of allRefs(b))await deletePhoto(r)}
async function deletePhoto(r){try{if(!r)return;if(r.i)await idbDo("readwrite",s=>s.delete(r.i));if(r.f&&store.uid)userCol("foto").doc(r.f).delete().catch(()=>{})}catch(e){}}

/* Foto: dikecilkan + cap waktu */
async function compress(file,max=1400,q=.8,stamp=true){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("File bukan gambar"));i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);
    if(stamp){const fs=Math.max(14,Math.round(c.width/30)),pad=Math.round(fs*.6);
    const label=fmtDT(Date.now())+" · Cek Cucian";
    g.font=`600 ${fs}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const tw=g.measureText(label).width;
    g.fillStyle="rgba(0,0,0,.55)";g.fillRect(c.width-tw-pad*3,c.height-fs-pad*3,tw+pad*2,fs+pad*2);
    g.fillStyle="#fff";g.textBaseline="top";g.fillText(label,c.width-tw-pad*2,c.height-fs-pad*2);}
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
  }finally{URL.revokeObjectURL(url)}
}
async function savePhoto(file){
  if(store.mode==="cloud"){
    let u=await blobToDataURL(await compress(file,1200,.72));
    if(u.length>950000)u=await blobToDataURL(await compress(file,900,.6));
    const id=uid();userCol("foto").doc(id).set({d:u,t:Date.now()}).catch(e=>toast("Foto gagal diunggah: "+fbErr(e)));
    store.cache.set(id,u);return {f:id};
  }
  const blob=await compress(file);const id=uid();
  await idbDo("readwrite",s=>s.put(blob,id));
  store.cache.set(id,URL.createObjectURL(blob));
  return {i:id};
}
function photoSrc(r){
  if(!r)return null;const k=r.i||r.f;if(!k)return null;
  if(store.cache.has(k))return store.cache.get(k);
  store.cache.set(k,null);
  if(r.f){if(store.uid)userCol("foto").doc(r.f).get().then(s=>{if(s.exists){store.cache.set(k,s.data().d);refreshImages()}}).catch(()=>{})}
  else idbDo("readonly",s=>s.get(r.i)).then(b=>{if(b){store.cache.set(k,URL.createObjectURL(b));refreshImages()}}).catch(()=>{});
  return null;
}

/* ================= Status & bantuan ================= */
const ui={view:"list",id:null,tab:"catatan"};
let sheetOpen=false,sheetRedraw=null;
function counts(b){
  let pcs=0,ok=0,bad=0,okPcs=0;const items=b.items||[];
  for(const it of items){const n=Number(it.jumlah)||1;pcs+=n;if(it.cek==="ok"){ok++;okPcs+=n}else if(it.cek==="masalah")bad++}
  return {n:items.length,pcs,ok,bad,okPcs,done:ok+bad};
}
const selesaiCek=b=>{const c=counts(b);return c.n>0&&c.done===c.n};
function dueInfo(b){
  if(!b.tglAmbil||selesaiCek(b))return null;
  const d=Math.round((new Date(b.tglAmbil+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
  const jam=b.jamAmbil?" "+fmtJam(b.jamAmbil):"";
  if(d<0)return {cls:"bad",txt:`Terlambat ${-d} hari`,rank:0};
  if(d===0){if(b.jamAmbil&&Date.now()>=ambilAt(b))return {cls:"due",txt:"Sudah waktunya diambil",rank:.5};return {cls:"due",txt:"Ambil hari ini"+jam,rank:1}}
  if(d===1)return {cls:"wait",txt:"Ambil besok"+jam,rank:2};
  return {cls:"wait",txt:`Ambil ${d} hari lagi`,rank:3};
}
function statusChip(b){
  const c=counts(b);
  if(selesaiCek(b))return c.bad?`<span class="chip bad">${c.bad} bermasalah</span>`:`<span class="chip ok">Lengkap</span>`;
  if(c.done)return`<span class="chip wait">Dicek ${c.done}/${c.n}</span>`;
  const d=dueInfo(b);
  if(!b.dikunci)return d&&d.rank<=1?`<span class="chip ${d.cls}">${d.txt}</span>`:`<span class="chip draft">Belum diantar</span>`;
  return d?`<span class="chip ${d.cls}">${d.txt}</span>`:`<span class="chip wait">Di laundry</span>`;
}
function waNumber(s){let d=String(s||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("0"))d="62"+d.slice(1);else if(d.startsWith("8"))d="62"+d;return d}
function openWA(num,text){
  const url=(num?`https://wa.me/${num}`:"https://wa.me/")+"?text="+encodeURIComponent(text);
  const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
}

function daftarText(b){
  const c=counts(b);
  const L=[`*Daftar cucian saya*`,`Laundry: ${b.laundry||"-"}`];
  if(b.nota)L.push(`No. nota: ${b.nota}`);
  L.push(`Diantar: ${b.dikunci?fmtDT(b.dikunci):fmtDate(b.tglAntar)}`);
  if(b.tglAmbil)L.push(`Janji ambil: ${fmtDate(b.tglAmbil)}`);
  L.push("");
  (b.items||[]).forEach((it,i)=>{
    L.push(`${i+1}. ${it.jenis}${it.warna?" – "+it.warna:""} ×${it.jumlah||1}`);
    if(it.catatan)L.push(`   Kondisi awal: ${it.catatan}`);
    if((it.perawatan||[]).length)L.push(`   Perawatan: ${it.perawatan.join(", ")}`);
  });
  L.push("",`*Total: ${c.pcs} pcs (${c.n} jenis)*`,"","Mohon dicek kesesuaiannya. Terima kasih.","_Dicatat dengan Cek Cucian, lengkap dengan foto._");
  return L.join("\n");
}
function masalahText(b){
  const c=counts(b);
  const L=[`*Laporan pengecekan cucian*`,`Laundry: ${b.laundry||"-"}${b.nota?" · nota "+b.nota:""}`,`Diantar: ${b.dikunci?fmtDT(b.dikunci):fmtDate(b.tglAntar)} · total ${c.pcs} pcs`,"","Barang tidak sesuai:"];
  (b.items||[]).filter(i=>i.cek==="masalah").forEach(i=>{
    const k=(i.cekJumlah!=null&&i.cekJumlah!=="")?` – kembali ${i.cekJumlah} dari ${i.jumlah||1}`:"";
    L.push(`- ${i.jenis}${i.warna?" ("+i.warna+")":""} ×${i.jumlah||1}${k}${i.cekCatatan?". "+i.cekCatatan:""}`);

  L.push("","Saya punya foto barang sebelum diantar dan bisa saya kirimkan. Mohon ditindaklanjuti. Terima kasih.");

}

function openSheet(html,onOpen){

  const scrim=ov.firstElementChild;

  ov.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheet);
  onOpen&&onOpen(ov.querySelector(".sheet"));
}

/* Komponen pengelola foto di dalam lembar isian */
function photoField(arr,elId,onBusy){
  let busy=0;const removed=[];
  const draw=()=>{
    const ph=$("#"+elId);if(!ph)return;
    ph.innerHTML=arr.map((r,i)=>{const s=photoSrc(r);return `<div class="ph">${s?`<img src="${esc(s)}" alt="Foto ${i+1}">`:""}<button data-rm="${i}" aria-label="Hapus foto ${i+1}">✕</button></div>`}).join("")
      +Array.from({length:busy},()=>`<div class="ph loading"></div>`).join("")
      +`<button class="addph" data-cam="1">${ICON.cam}Kamera</button><button class="addph" data-cam="0">${ICON.img}Galeri</button>`;
    ph.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{removed.push(...arr.splice(+x.dataset.rm,1));draw()});
    ph.querySelectorAll("[data-cam]").forEach(x=>x.onclick=()=>pickPhotos(handle,x.dataset.cam==="1"));
    onBusy&&onBusy(busy>0);
  };
  async function handle(files){for(const f of files){busy++;draw();try{arr.push(await savePhoto(f))}catch(e){toast("Foto gagal disimpan: "+(e&&e.message||"coba lagi"))}finally{busy--;draw()}}}
  return {draw,removed,busy:()=>busy>0};
}

function lastBackup(){return Number(lsGet(LB_KEY,0))||0}
function daysSince(t){return Math.max(1,Math.floor((Date.now()-t)/864e5))}
function backupDue(){const t=lastBackup();return !t||Date.now()-t>7*864e5}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
const sizeTxt=b=>b>1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";
async function buildBackup(){
  const foto={};let n=0;
  for(const b of store.batches)for(const r of allRefs(b)){
    const k=r&&(r.i||r.f);if(k&&!foto[k]){const u=await photoDataURL(r);if(u){foto[k]=u;n++}}
  }
  const blob=new Blob([JSON.stringify({app:"cek-cucian",versi:2,dibuat:new Date().toISOString(),kiriman:store.batches,foto})],{type:"application/json"});
  const name="cek-cucian-cadangan-"+today()+".json";
  return {blob,name,file:new File([blob],name,{type:"application/json"}),nFoto:n};
}
async function openBackupSheet(){
  openSheet(`<div class="sh"><h2>Cadangkan data</h2><button class="btn ghost" data-close>Tutup</button></div><p class="muted" id="bkInfo" style="margin:0">Menyiapkan file cadangan…</p><div class="actions" id="bkAct" style="margin:0"></div>`);
  let bk;try{bk=await buildBackup()}catch(e){$("#bkInfo").textContent="Gagal menyiapkan cadangan: "+(e&&e.message||"coba lagi");return}
  if(!$("#bkInfo"))return;
  $("#bkInfo").innerHTML=`<b>${store.batches.length} kiriman, ${bk.nFoto} foto</b> · ukuran ${esc(sizeTxt(bk.blob.size))}<br>Nama file: <span class="mono">${esc(bk.name)}</span><br><br>Pilih <b>Bagikan</b> untuk menyimpan ke Google Drive atau mengirim ke WhatsApp sendiri. Pilih <b>Unduh</b> untuk menyimpan ke folder Download.`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[bk.file]}));
  $("#bkAct").innerHTML=(canShare?`<button class="btn primary" id="bkShare">${ICON.share}Bagikan ke Drive / WhatsApp</button>`:"")+`<button class="btn ${canShare?"":"primary"}" id="bkDl">${ICON.save}Unduh file</button>`;
  const mark=()=>lsSet(LB_KEY,String(Date.now()));
  if(canShare)$("#bkShare").onclick=async()=>{try{await navigator.share({files:[bk.file],title:"Cadangan Cek Cucian"});mark();closeSheet();toast("Cadangan dibagikan")}catch(e){if(e&&e.name!=="AbortError")toast("Gagal membagikan. Coba Unduh file.")}};
  $("#bkDl").onclick=()=>{const url=URL.createObjectURL(bk.blob);const a=document.createElement("a");a.href=url;a.download=bk.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);mark();closeSheet();toast("File cadangan diunduh ke folder Download")};
}
$("#restoreIn").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=JSON.parse(await f.text())}catch(err){toast("File tidak bisa dibaca. Pilih file .json cadangan Cek Cucian.");return}
  if(!data||data.app!=="cek-cucian"||!Array.isArray(data.kiriman)){toast("Ini bukan file cadangan Cek Cucian.");return}
  const ada=new Map(store.batches.map(b=>[b.id,b]));let baru=0,upd=0,sama=0;

    <ul class="muted" style="margin:0;padding-left:20px"><li>${baru} kiriman baru akan ditambahkan</li><li>${upd} kiriman diganti dengan versi yang lebih baru</li><li>${sama} kiriman sudah ada dan tidak diubah</li></ul>
    <p class="muted" style="margin:0">Data lain di HP ini tetap aman.</p>
    <button class="btn primary" id="rsGo">${ICON.upload}Pulihkan</button>`,()=>{
      $("#rsGo").onclick=async()=>{
        const btn=$("#rsGo");btn.disabled=true;btn.textContent="Memulihkan…";
        try{
          const isNewer=b=>{const l=ada.get(b&&b.id);return b&&typeof b.id==="string"&&(!l||(b.diubah||0)>(l.diubah||0))};
          const need=new Set();data.kiriman.filter(isNewer).forEach(b=>allRefs(b).forEach(r=>r&&need.add(r.i||r.f)));
          const map=new Map();
          for(const [id,u] of Object.entries(data.foto||{})){if(!need.has(id)||typeof u!=="string"||!u.startsWith("data:image/"))continue;btn.textContent=`Memulihkan foto ${map.size+1}…`;map.set(id,await importPhoto(u,id))}
          for(const b of data.kiriman.filter(isNewer)){remapRefs(b,map);const l=ada.get(b.id);
            if(store.mode==="cloud")cloudWrite(b);else if(!l)store.batches.push(b);else store.batches[store.batches.indexOf(l)]=b}
          const done=()=>{closeSheet();toast(`Dipulihkan: ${baru} kiriman baru, ${upd} diperbarui`)};
          if(store.mode==="cloud")done();
          else{store.batches.sort((a,b)=>(b.tglAntar||"").localeCompare(a.tglAntar||"")||(b.dibuat||0)-(a.dibuat||0));if(persist())done()}
        }catch(err){toast("Gagal memulihkan: "+(err&&err.message||"coba lagi"));btn.disabled=false;btn.textContent="Pulihkan"}
      };
    });
});

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function randHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function getRec(k){try{return JSON.parse(lsGet(k,"null"))}catch(e){return null}}
async function putHash(k,v){const salt=randHex(16);return lsSet(k,JSON.stringify({salt,hash:await sha(salt+v)}))}
async function checkHash(k,v){const p=getRec(k);return !!p&&await sha(p.salt+v)===p.hash}
function newRecovery(){const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const a=new Uint8Array(8);crypto.getRandomValues(a);const s=[...a].map(x=>al[x%al.length]).join("");return s.slice(0,4)+"-"+s.slice(4)}
const hasPin=()=>!!getRec(PIN_KEY);

const LOGO='<span class="logo lk-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg></span>';
function waitLeft(){return Math.max(0,(Number(lsGet(WAIT_KEY,0))||0)-Date.now())}

      <h2>Mulai dari awal</h2>
      <p class="muted">Tanpa PIN dan kode pemulihan, satu-satunya cara adalah menghapus semua catatan dan foto di HP ini, lalu membuat PIN baru. Kalau Anda punya file cadangan, data bisa dipulihkan setelahnya.</p>
      <label class="small" for="rsIn">Ketik <b>HAPUS</b> untuk melanjutkan</label>

      <button class="btn danger big" id="rsGo" disabled>Hapus semua data</button>
      <button class="btn ghost" id="rsBack">Batal</button>

  }
  const titles={unlock:["Masukkan PIN","Untuk membuka catatan cucian Anda"],create:[lk.reason==="change"?"Buat PIN baru":lk.reason==="recover"?"Buat PIN baru":"Buat PIN",`${PIN_LEN} angka untuk membuka Cek Cucian di HP ini`],confirm:["Ulangi PIN","Masukkan PIN yang sama sekali lagi"],verify:["PIN saat ini","Masukkan PIN lama untuk menggantinya"]};

    <p class="lk-msg" id="lkMsg">${w?`Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil(w/1000)} detik.`:esc(lk.msg)}</p>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}" ${w?"disabled":""}>${n}</button>`).join("")}
      <span></span><button data-k="0" ${w?"disabled":""}>0</button><button data-k="del" aria-label="Hapus angka">⌫</button></div>
    <div class="lk-foot">${m==="unlock"?`<button class="btn ghost" id="lkForgot">Lupa PIN?</button>`:""}${m==="verify"||(m==="create"&&lk.reason==="change")?`<button class="btn ghost" id="lkCancel">Batal</button>`:""}${m==="confirm"?`<button class="btn ghost" id="lkRedo">Ulangi dari awal</button>`:""}</div>
  </div></div>`;
  lockEl.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));

  const r=$("#lkRedo");if(r)r.onclick=()=>{lk.mode="create";lk.entry="";lk.first="";lk.msg="";drawLock()};
  clearTimeout(waitTimer);if(w)waitTimer=setTimeout(drawLock,1000);

function shake(){const d=$("#dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake")}}
async function press(k){
  if(lk.busy)return;
  if(k==="del"){lk.entry=lk.entry.slice(0,-1);lk.msg="";drawLock();return}
  if(lk.entry.length>=PIN_LEN)return;
  lk.entry+=k;lk.msg="";drawLock();
  if(lk.entry.length<PIN_LEN)return;
  lk.busy=true;await new Promise(r=>setTimeout(r,120));
  const pin=lk.entry;lk.entry="";
  try{
    if(lk.mode==="unlock"||lk.mode==="verify"){
      if(await checkHash(PIN_KEY,pin)){
        if(lk.mode==="verify"){lk.busy=false;lockScreen("create",{reason:"change"});return}
        lk.busy=false;finishUnlock();return}
      const n=(Number(lsGet(FAIL_KEY,0))||0)+1;lsSet(FAIL_KEY,String(n));
      if(n>=5&&n%5===0){lsSet(WAIT_KEY,String(Date.now()+30000*(n/5)));lk.msg=""}
      else lk.msg=`PIN salah.${n>=3?` ${5-(n%5)} percobaan lagi sebelum dijeda.`:""}`;
      drawLock();shake();
    }else if(lk.mode==="create"){
      if(/^(\d)\1+$/.test(pin)||"0123456789".includes(pin)||"9876543210".includes(pin)){lk.msg="PIN terlalu mudah ditebak. Pilih kombinasi lain.";drawLock();shake()}
      else{lk.first=pin;lk.mode="confirm";drawLock()}
    }else if(lk.mode==="confirm"){
      if(pin!==lk.first){lk.mode="create";lk.first="";lk.msg="PIN tidak sama. Buat ulang PIN Anda.";drawLock();shake()}
      else{
        const reason=lk.reason;await putHash(PIN_KEY,pin);lsSet(FAIL_KEY,"0");lsSet(WAIT_KEY,"0");
        if(reason==="change"){lk.busy=false;lockEl.hidden=true;lockEl.innerHTML="";document.body.classList.remove("locked");unlocked=true;render();toast("PIN berhasil diganti");return}
        const code=newRecovery();await putHash(REC_KEY,normCode(code));
        lk.busy=false;lockScreen("showcode",{code});return;
      }
    }
  }finally{lk.busy=false}
}
document.addEventListener("keydown",e=>{

  if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");
});
document.addEventListener("visibilitychange",()=>{

});
function newRecoveryFlow(){const code=newRecovery();putHash(REC_KEY,normCode(code)).then(()=>{lockEl.hidden=false;document.body.classList.add("locked");lk={mode:"showcode",code,then:()=>{lockEl.hidden=true;lockEl.innerHTML="";document.body.classList.remove("locked");toast("Kode pemulihan baru tersimpan")}};drawLock()})}

/* ================= Pengingat ambil ================= */
const INGAT_OPS=[[0,"Tepat jam ambil"],[30,"30 menit sebelum"],[60,"1 jam sebelum"],[120,"2 jam sebelum"],[-1,"Tidak usah diingatkan"]];
const fmtJam=s=>s?s.replace(":","."):"";
function ambilAt(b){if(!b.tglAmbil)return null;const t=new Date(b.tglAmbil+"T"+(b.jamAmbil||"08:00")+":00").getTime();return isNaN(t)?null:t}
function remindAt(b){const t=ambilAt(b);if(t==null)return null;const m=b.ingat==null?0:Number(b.ingat);if(m<0)return null;return b.jamAmbil?t-m*60000:t}
const notifOK=()=>"Notification" in window&&Notification.permission==="granted";
function reminderList(){
  return store.batches.filter(b=>!selesaiCek(b)).map(b=>{const t=remindAt(b);if(t==null)return null;const c=counts(b);
    return {key:b.id+"@"+t,id:b.id,t,title:"Waktunya ambil cucian",body:`${b.laundry||"Laundry"} · ${c.pcs} pcs · janji ambil ${b.jamAmbil?"jam "+fmtJam(b.jamAmbil):"hari ini"}. Jangan lupa cek barang saat mengambil.`}}).filter(Boolean);
}
async function metaGet(k){try{return await idbDo("readonly",s=>s.get(k),"meta")}catch(e){return null}}
async function metaPut(k,v){try{await idbDo("readwrite",s=>s.put(v,k),"meta")}catch(e){}}
let remTimers=[],schedQ=null;
function queueSchedule(){clearTimeout(schedQ);schedQ=setTimeout(scheduleReminders,400)}
async function scheduleReminders(){
  if(!unlocked)return;
  remTimers.forEach(clearTimeout);remTimers=[];
  const shown=new Set((await metaGet("shown"))||[]);
  const list=reminderList(),now=Date.now(),due=[];
  for(const r of list){
    if(shown.has(r.key))continue;
    if(r.t<=now){if(now-r.t<12*3600e3)due.push(r);else shown.add(r.key)}
    else if(r.t-now<2147483647)remTimers.push(setTimeout(()=>fireReminder(r),r.t-now));
  }
  await metaPut("shown",[...shown].slice(-300));
  await metaPut("reminders",list);
  for(const r of due)await fireReminder(r);
}
async function fireReminder(r){
  const shown=new Set((await metaGet("shown"))||[]);
  if(shown.has(r.key))return;shown.add(r.key);await metaPut("shown",[...shown].slice(-300));
  await showNotif(r.title,r.body,r.id);
}
async function showNotif(title,body,id){
  if(notifOK()){
    const opt={body,icon:"icon-192.png",badge:"icon-192.png",tag:"ambil-"+id,renotify:true,requireInteraction:true,vibrate:[200,100,200],data:{id}};
    try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,opt);return true}}catch(e){}
    try{new Notification(title,opt);return true}catch(e){}
  }
  toast(title+" · "+body);return false;
}
async function registerPeriodic(){
  try{const reg=await navigator.serviceWorker.ready;if(!reg.periodicSync||!notifOK())return;
    let ok=true;try{const st=await navigator.permissions.query({name:"periodic-background-sync"});ok=st.state==="granted"}catch(e){}
    if(ok)await reg.periodicSync.register("cek-pengingat",{minInterval:3600e3});
  }catch(e){}
}
async function askNotif(){
  if(!("Notification" in window)){toast(isIOS()?"Di iPhone, pasang aplikasi ke Layar Utama dulu agar notifikasi bisa muncul.":"Browser ini tidak mendukung notifikasi. Pakai tombol Tambah ke kalender.");return false}
  if(Notification.permission==="granted"){registerPeriodic();return true}
  if(Notification.permission==="denied"){toast("Notifikasi diblokir. Izinkan lewat pengaturan situs di browser.");return false}
  let p="default";try{p=await Notification.requestPermission()}catch(e){}
  if(p==="granted"){registerPeriodic();queueSchedule();toast("Notifikasi pengingat aktif");if(!sheetOpen)render();return true}
  if(!sheetOpen)render();return false;
}
function reminderHTML(){
  const st="Notification" in window?Notification.permission:"unsupported";
  const txt={granted:"Notifikasi aktif di HP ini.",denied:"Notifikasi diblokir di browser. Buka pengaturan situs (ikon di kiri alamat web), lalu izinkan Notifikasi.",default:"Notifikasi belum diizinkan.",unsupported:isIOS()?"Di iPhone, notifikasi baru bisa setelah aplikasi dipasang ke Layar Utama (iOS 16.4 ke atas).":"Browser ini tidak mendukung notifikasi."}[st];
  return `<section class="backup sec-card"><div><h3>${ICON.bell}Pengingat ambil</h3>
    <p class="muted"><b class="${st==="granted"?"ok-t":"bad-t"}">${txt}</b> Notifikasi muncul sesuai jam ambil di tiap kiriman. Supaya pasti berbunyi walau aplikasi tertutup lama, tambahkan juga ke kalender HP dari halaman kiriman.</p></div>
    <div class="actions" style="margin:0">${st==="default"?`<button class="btn primary" data-act="notifon">${ICON.bell}Izinkan notifikasi</button>`:""}${st==="granted"?`<button class="btn" data-act="notiftest">${ICON.bell}Kirim notifikasi uji</button>`:""}</div></section>`;
}
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function openCalSheet(b){
  const t=ambilAt(b),c=counts(b),pad=n=>String(n).padStart(2,"0");
  const title=`Ambil cucian – ${b.laundry||"Laundry"}`;
  const details=`${c.pcs} pcs (${c.n} jenis)${b.nota?" · nota "+b.nota:""}. Buka Cek Cucian untuk mengecek barang saat mengambil.`;
  const loc=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const utc=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const day=s=>s.replace(/-/g,"");
  const nextDay=s=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+1);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`};
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"";
  const gdates=b.jamAmbil?loc(new Date(t))+"/"+loc(new Date(t+30*60000)):day(b.tglAmbil)+"/"+nextDay(b.tglAmbil);
  const gurl=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${gdates}&details=${encodeURIComponent(details)}${b.jamAmbil&&tz?"&ctz="+encodeURIComponent(tz):""}`;
  const m=Math.max(0,Number(b.ingat)||0);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cek Cucian//ID","CALSCALE:GREGORIAN","BEGIN:VEVENT",`UID:${b.id}@cek-cucian`,`DTSTAMP:${utc(new Date())}`,
    ...(b.jamAmbil?[`DTSTART:${utc(new Date(t))}`,`DTEND:${utc(new Date(t+30*60000))}`]:[`DTSTART;VALUE=DATE:${day(b.tglAmbil)}`,`DTEND;VALUE=DATE:${nextDay(b.tglAmbil)}`]),
    `SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(details)}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`,b.jamAmbil?`TRIGGER:-PT${m}M`:"TRIGGER:PT8H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  openSheet(`<div class="sh"><h2>Tambah ke kalender</h2><button class="btn ghost" data-close>Tutup</button></div>
    <p style="margin:0"><b>${esc(fmtDate(b.tglAmbil))}${b.jamAmbil?", jam "+esc(fmtJam(b.jamAmbil)):""}</b> · ${esc(b.laundry||"Laundry")}</p>
    <p class="muted" style="margin:0">Kalender HP akan membunyikan pengingat walau Cek Cucian sedang ditutup.</p>
    <a class="btn primary" id="calG" href="${esc(gurl)}" target="_blank" rel="noopener">${ICON.cal}Google Calendar</a>
    <button class="btn" id="calI">${ICON.save}File kalender (iPhone / Samsung)</button>`,()=>{
      $("#calI").onclick=()=>{const blob=new Blob([ics],{type:"text/calendar"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ambil-cucian.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Buka file ambil-cucian.ics untuk menambahkan ke kalender")};
    });
}
let pendingOpen=new URLSearchParams(location.search).get("kiriman");
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.open&&e.data.open!=="tes"){pendingOpen=e.data.open;if(!sheetOpen)render()}});

/* ================= Mulai ================= */
/* ================= Akun Firebase ================= */
const FB_VER="10.14.1";
let migrateAsked=false;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Gagal memuat "+src));document.head.appendChild(s)})}
function userCol(n){return store.db.collection("users").doc(store.uid).collection(n)}
function fbErr(e){const c=(e&&e.code)||"";const M={
  "auth/invalid-credential":"Email atau password salah.","auth/invalid-login-credentials":"Email atau password salah.","auth/wrong-password":"Email atau password salah.",
  "auth/user-not-found":"Email belum terdaftar. Pilih Daftar sekarang.","auth/email-already-in-use":"Email ini sudah terdaftar. Silakan masuk.",
  "auth/weak-password":"Password minimal 6 karakter.","auth/invalid-email":"Format email tidak benar.","auth/missing-password":"Password belum diisi.",
  "auth/too-many-requests":"Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.","auth/network-request-failed":"Tidak ada koneksi internet.",
  "auth/unauthorized-domain":"Alamat aplikasi ini belum diizinkan di Firebase (Authentication → Settings → Authorized domains).",
  "auth/operation-not-allowed":"Metode masuk ini belum diaktifkan di Firebase console.","auth/popup-blocked":"Jendela login diblokir browser.",
  "permission-denied":"Akses ditolak. Periksa aturan keamanan Firestore.","unavailable":"Server tidak bisa dihubungi. Perubahan dikirim saat online."};
  return M[c]||(e&&e.message)||"Terjadi kesalahan."}
function cloudWrite(b){const d=JSON.parse(JSON.stringify(b));const id=d.id;delete d.id;userCol("kiriman").doc(id).set(d).catch(e=>toast("Gagal menyimpan: "+fbErr(e)))}
async function startCloud(cfg){
  showAuth("loading");
  try{
    for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(cfg);
    store.auth=firebase.auth();store.auth.languageCode="id";
    store.db=firebase.firestore();
    try{await store.db.enablePersistence({synchronizeTabs:true})}catch(e){}
    store.auth.getRedirectResult().catch(e=>showAuth("masuk",fbErr(e)));
    store.auth.onAuthStateChanged(u=>{if(u)enterCloud(u);else leaveCloud()});
  }catch(e){showAuth("offline")}
}
function enterCloud(u){
  if(store.unsub)store.unsub();
  store.uid=u.uid;store.user=u;store.loaded=false;store.batches=[];
  lockEl.hidden=true;lockEl.innerHTML="";document.body.classList.remove("locked");unlocked=true;
  render();
  let first=true;
  store.unsub=userCol("kiriman").onSnapshot(snap=>{
    store.batches=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.tglAntar||"").localeCompare(a.tglAntar||"")||(b.dibuat||0)-(a.dibuat||0));
    store.loaded=true;if(!sheetOpen)render();
    if(first){first=false;setTimeout(afterFirstLoad,150)}
  },e=>{store.loaded=true;render();toast("Tidak bisa memuat catatan: "+fbErr(e))});
}
function leaveCloud(){
  if(store.unsub){store.unsub();store.unsub=null}
  store.uid=null;store.user=null;store.batches=[];store.loaded=false;store.cache.clear();metaPut("reminders",[]);remTimers.forEach(clearTimeout);
  unlocked=false;$("#view").innerHTML="";$("#overlay").innerHTML="";sheetOpen=false;sheetRedraw=null;
  showAuth("masuk");
}
function localBatches(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")||[]}catch(e){return[]}}
function afterFirstLoad(){
  const local=localBatches();
  if(local.length&&!migrateAsked){migrateAsked=true;offerMigrate(local)}
  else if(!lsGet(OB_KEY)&&!store.batches.length)openOnboarding();
}
function offerMigrate(local){
  openSheet(`<div class="sh"><h2>Pindahkan catatan lama</h2><button class="btn ghost" data-close>Nanti</button></div>
    <p style="margin:0">Ada <b>${local.length} kiriman</b> yang tersimpan di HP ini dari sebelum Anda login. Pindahkan ke akun supaya ikut tersimpan aman dan bisa dibuka dari HP lain?</p>
    <p class="muted small" style="margin:0">Setelah dipindahkan, salinan di HP ini dihapus. Foto ikut dipindahkan.</p>
    <button class="btn primary" id="mgGo">${ICON.upload}Pindahkan ke akun</button>`,()=>{
      $("#mgGo").onclick=async()=>{const btn=$("#mgGo");btn.disabled=true;
        try{await migrateLocal(local,btn);closeSheet();toast(`${local.length} kiriman dipindahkan ke akun`)}
        catch(e){btn.disabled=false;btn.textContent="Coba lagi";toast("Gagal memindahkan: "+fbErr(e))}};
    });
}
async function migrateLocal(local,btn){
  let done=0;
  for(const b of local){
    const map=new Map();
    for(const r of allRefs(b)){if(r&&r.i&&!map.has(r.i)){try{const blob=await idbDo("readonly",s=>s.get(r.i));if(blob)map.set(r.i,await importPhoto(await blobToDataURL(blob),r.i))}catch(e){}}}
    remapRefs(b,map);
    if(!store.batches.some(x=>x.id===b.id))cloudWrite(b);
    done++;btn.textContent=`Memindahkan ${done}/${local.length}…`;
  }
  try{localStorage.removeItem(LS_KEY)}catch(e){}
  try{await idbDo("readwrite",s=>s.clear())}catch(e){}
}
async function importPhoto(u,id){
  if(store.mode==="cloud"){
    if(u.length>950000){const bl=await (await fetch(u)).blob();u=await blobToDataURL(await compress(bl,1000,.7,false))}
    const nid=uid();userCol("foto").doc(nid).set({d:u,t:Date.now()}).catch(e=>toast("Foto gagal diunggah: "+fbErr(e)));
    store.cache.set(nid,u);return {f:nid};
  }
  const blob=await (await fetch(u)).blob();await idbDo("readwrite",s=>s.put(blob,id));store.cache.delete(id);return {i:id};
}
function remapRefs(b,map){const fix=a=>(a||[]).map(r=>(r&&map.get(r.i||r.f))||r);b.fotoUmum=fix(b.fotoUmum);(b.items||[]).forEach(it=>{it.foto=fix(it.foto);if(it.cekFoto)it.cekFoto=fix(it.cekFoto)})}
async function photoDataURL(r){
  if(!r)return null;
  if(r.f){const c=store.cache.get(r.f);if(c)return c;try{const s=await userCol("foto").doc(r.f).get();return s.exists?s.data().d:null}catch(e){return null}}
  if(r.i){const blob=await idbDo("readonly",s=>s.get(r.i));return blob?await blobToDataURL(blob):null}
  return null;
}
function accountHTML(){
  const u=store.user||{};
  return `<section class="backup sec-card"><div><h3>${ICON.lock}Akun</h3><p class="muted">Masuk sebagai <b>${esc(u.email||u.displayName||"-")}</b>. Catatan dan foto tersimpan di akun ini dan bisa dibuka dari HP lain dengan login yang sama.</p></div>
    <div class="actions" style="margin:0"><button class="btn" data-act="backup">${ICON.save}Unduh cadangan</button><button class="btn" data-act="restore">${ICON.upload}Impor cadangan</button><button class="btn danger" data-act="logout">Keluar</button></div></section>`;
}
function showAuth(mode,msg,ok){
  lockEl.hidden=false;document.body.classList.add("locked");
  const L=LOGO+'<div class="lk-brand">Cek Cucian</div>';
  if(mode==="loading"){lockEl.innerHTML=`<div class="lk"><div class="lk-in">${L}<p class="muted">Menyiapkan…</p></div></div>`;return}
  if(mode==="offline"){
    lockEl.innerHTML=`<div class="lk"><div class="lk-in">${L}<h2>Tidak bisa terhubung</h2><p class="muted">Periksa koneksi internet, lalu coba lagi. Login pertama kali perlu internet.</p><button class="btn primary big" id="auRetry">Coba lagi</button></div></div>`;
    $("#auRetry").onclick=()=>location.reload();return;
  }
  if(mode==="lupa"){
    lockEl.innerHTML=`<div class="lk"><div class="lk-in auth">${L}<h2>Lupa password</h2><p class="muted">Masukkan email akun Anda. Kami kirimkan link untuk membuat password baru.</p>
      <form id="auF" class="auform" novalidate><input type="email" id="auE" autocomplete="email" placeholder="Email" required>
      <p class="lk-msg ${ok?"ok":""}" id="auMsg">${esc(msg||"")}</p><button class="btn primary big" type="submit" id="auGo">Kirim link reset</button></form>
      <button class="btn ghost" id="auBack">Kembali ke halaman masuk</button></div></div>`;
    $("#auBack").onclick=()=>showAuth("masuk");
    $("#auF").onsubmit=async e=>{e.preventDefault();const em=$("#auE").value.trim();if(!em){setAuMsg("Email belum diisi.");return}
      busyBtn(true);try{await store.auth.sendPasswordResetEmail(em);showAuth("lupa","Link reset sudah dikirim ke "+em+". Cek juga folder spam.",true)}catch(err){busyBtn(false);setAuMsg(fbErr(err))}};
    return;
  }
  const reg=mode==="daftar";
  lockEl.innerHTML=`<div class="lk"><div class="lk-in auth">${L}
    <h2>${reg?"Buat akun":"Masuk"}</h2>
    <p class="muted">${reg?"Daftar gratis supaya catatan cucian tersimpan aman di akun Anda.":"Masuk untuk membuka catatan cucian Anda dari HP mana saja."}</p>
    <button class="btn gbtn big" id="auG"><span class="g-dot" aria-hidden="true">G</span>Masuk dengan Google</button>
    <div class="or"><span>atau dengan email</span></div>
    <form id="auF" class="auform" novalidate>
      <input type="email" id="auE" autocomplete="email" placeholder="Email" required>
      <div class="pw"><input type="password" id="auP" autocomplete="${reg?"new-password":"current-password"}" placeholder="Password${reg?" (min. 6 karakter)":""}" required><button type="button" class="pwt" id="auT">Lihat</button></div>
      ${reg?`<input type="password" id="auP2" autocomplete="new-password" placeholder="Ulangi password" required>`:""}
      <p class="lk-msg" id="auMsg">${esc(msg||"")}</p>
      <button class="btn primary big" type="submit" id="auGo">${reg?"Daftar":"Masuk"}</button>
    </form>
    ${reg?"":`<button class="btn ghost" id="auLupa">Lupa password?</button>`}
    <p class="small muted" style="margin:0">${reg?"Sudah punya akun?":"Belum punya akun?"} <button class="linkbtn" id="auSw">${reg?"Masuk":"Daftar sekarang"}</button></p>
  </div></div>`;
  $("#auSw").onclick=()=>showAuth(reg?"masuk":"daftar");
  const lp=$("#auLupa");if(lp)lp.onclick=()=>showAuth("lupa");
  $("#auT").onclick=()=>{const p=$("#auP");const show=p.type==="password";p.type=show?"text":"password";const p2=$("#auP2");if(p2)p2.type=p.type;$("#auT").textContent=show?"Sembunyikan":"Lihat"};
  $("#auG").onclick=async()=>{
    const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
    try{await store.auth.signInWithPopup(pr)}
    catch(err){if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(err.code)){try{await store.auth.signInWithRedirect(pr)}catch(e2){setAuMsg(fbErr(e2))}}
      else if(!["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(err.code))setAuMsg(fbErr(err))}
  };
  $("#auF").onsubmit=async e=>{
    e.preventDefault();const em=$("#auE").value.trim(),pw=$("#auP").value;
    if(!em||!pw){setAuMsg("Email dan password wajib diisi.");return}
    if(reg){if(pw.length<6){setAuMsg("Password minimal 6 karakter.");return}if(pw!==$("#auP2").value){setAuMsg("Ulangi password tidak sama.");return}}
    busyBtn(true);
    try{if(reg)await store.auth.createUserWithEmailAndPassword(em,pw);else await store.auth.signInWithEmailAndPassword(em,pw)}
    catch(err){busyBtn(false);setAuMsg(fbErr(err))}
  };
}
function setAuMsg(m){const el=$("#auMsg");if(el){el.className="lk-msg";el.textContent=m}}
function busyBtn(on){const b=$("#auGo");if(!b)return;if(on){b.dataset.t=b.textContent;b.textContent="Memproses…";b.disabled=true}else{b.textContent=b.dataset.t||b.textContent;b.disabled=false}}

load();
$("#lockBtn").onclick=()=>{if(hasPin())lockScreen("unlock")};
const CFG=window.FIREBASE_CONFIG;
if(CFG&&CFG.apiKey&&CFG.projectId&&!/ISI_DI_SINI/.test(CFG.apiKey)){store.mode="cloud";$("#lockBtn").hidden=true;startCloud(CFG)}
else lockScreen(hasPin()?"unlock":"create");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(()=>registerPeriodic()).catch(()=>{});
})();
