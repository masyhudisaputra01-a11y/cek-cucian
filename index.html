<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7d8c">
<meta name="description" content="Catat dan foto baju sebelum dibawa ke laundry, lalu cocokkan saat diambil.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cek Cucian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: satu kolom ala nota laundry — daftar kiriman, lalu detail dengan tab Catatan / Cek ambil */
:root{
  --bg:#eef3f4; --paper:#ffffff; --ink:#15272d; --muted:#5c7178; --line:#d3dfe2;
  --accent:#0f7d8c; --accent-ink:#ffffff; --accent-soft:#d9eef1;
  --tag:#f7d55c; --tag-ink:#3d3205;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --bad:#c2412d; --bad-soft:#fbe3de; --wait:#9a6b00; --wait-soft:#fbefcc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sub{margin:6px 0 20px;color:var(--muted);max-width:60ch}
.note{font-size:.85rem;padding:10px 14px;border-radius:10px;background:var(--wait-soft);color:var(--ink);margin-bottom:16px}

/* nota card */
.list{display:grid;gap:14px}
.nota{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;color:inherit;width:100%}
.nota:hover{border-color:var(--accent)}
.hang{width:54px;min-height:64px;background:var(--tag);color:var(--tag-ink);border-radius:8px 8px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding-top:10px;font-family:var(--f-mono);font-size:.7rem;text-align:center;line-height:1.2}
.hang::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--paper)}
.hang b{font-size:1.25rem;font-family:var(--f-display);font-weight:800}
.nota .meta{min-width:0}
.nota .meta h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nota .meta p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty svg{width:64px;height:64px;color:var(--accent)}
.empty ol{text-align:left;margin:4px 0 8px;padding-left:20px;color:var(--muted);max-width:42ch}

/* detail */
.back{margin:-6px 0 10px -8px}
.head-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.facts div{min-width:0}
.facts .v{font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.item.st-ok{border-color:var(--ok)}
.item.st-bad{border-color:var(--bad)}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:6px}
.thumb svg{width:30px;height:30px}
.item .body{min-width:0;display:grid;gap:4px}
.item .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .desc{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.qty{font-family:var(--f-mono);font-weight:500;background:var(--bg);border-radius:8px;padding:2px 8px;font-size:.85rem}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.checks .btn{padding:7px 12px;font-size:.85rem}
.checks .btn.on-ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.checks .btn.on-bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.issue{font-size:.85rem;color:var(--bad);overflow-wrap:anywhere}
.summary{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;margin-bottom:14px}
.summary.ok{background:var(--ok-soft)}
.summary.bad{background:var(--bad-soft)}
.summary.wait{background:var(--accent-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px;font-size:.9rem;color:var(--muted)}

/* fab */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:20;box-shadow:0 6px 20px rgba(15,60,70,.25);padding:14px 20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.stepper input{width:70px;text-align:center}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:84px;height:84px;border-radius:10px;overflow:hidden;position:relative;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem;line-height:1}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:600}
.addph svg{width:24px;height:24px}
.ph.loading::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:1.4rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:calc(14px + env(safe-area-inset-right, 0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
.backup{margin-top:32px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.backup p{margin:4px 0 0;font-size:.88rem;max-width:60ch}
.backup-due{display:grid;gap:10px;justify-items:start}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---- Tampilan HP v2 ---- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.wrap{padding-block:16px 130px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:720px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo svg{width:22px;height:22px}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.1;letter-spacing:-.01em}
.brand-s{font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;flex:none}
@media (max-width:370px){.brand-s{display:none}}
.pagehead{display:grid;gap:2px;margin:6px 0 14px}
.pagehead h1{font-size:1.6rem}
.pagehead p{margin:0;font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.stats b{font-family:var(--f-display);font-size:1.55rem;font-weight:800;line-height:1.1}
.stats span{font-size:.72rem;color:var(--muted);line-height:1.25}
.stats .warn{background:var(--bad-soft);border-color:transparent}
.stats .warn b{color:var(--bad)}
.label{margin-bottom:2px}
.list{gap:10px}
.nota{padding:14px;gap:12px;box-shadow:0 1px 2px rgba(10,40,50,.05);transition:transform .12s, border-color .12s}
.nota .meta h3{font-size:1rem}
.nota .meta p{font-size:.8rem}
.btn{min-height:44px;transition:transform .12s, background .12s}
.nota:active,.btn:active{transform:scale(.98)}
.back{min-height:40px}
.head-card{padding:0;gap:0;overflow:hidden;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.head-card > .row{background:var(--accent);color:var(--accent-ink);padding:16px 18px 18px;position:relative}
.head-card > .row .label{color:inherit;opacity:.8}
.head-card > .row::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 6px,var(--paper) 4px,transparent 4.5px) 0 0/16px 12px repeat-x}
.head-card > .row .chip{background:var(--paper)}
.head-card > *:not(.row){margin:0 18px}
.head-card > .facts{margin-top:20px}
.head-card > p{margin-top:14px !important}
.head-card > div:last-child:not(.facts){margin-top:14px;margin-bottom:16px}
.head-card > .facts:last-child,.head-card > p:last-child{margin-bottom:18px !important}
.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:620px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:20;box-shadow:0 4px 14px rgba(10,40,50,.08)}
.tabs button{min-height:40px}
.item{grid-template-columns:84px 1fr;padding:12px;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.item.st-ok{background:linear-gradient(var(--ok-soft),var(--ok-soft)) left/4px 100% no-repeat,var(--paper)}
.item.st-bad{background:linear-gradient(var(--bad-soft),var(--bad-soft)) left/4px 100% no-repeat,var(--paper)}
.thumb{width:84px;height:84px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks .btn{min-height:42px;padding:8px 10px}
.summary h3{font-size:1.05rem}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(10,40,50,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.bb-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.bb-in .btn{flex:1;min-height:48px;font-size:.95rem}
.bb-prog{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.bb-prog b{color:var(--ink);font-family:var(--f-mono)}
.bb-prog .bar{margin-top:6px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input[type=text],input[type=number],input[type=date],textarea{font-size:16px;min-height:46px}
.sheet{padding-top:0;gap:16px}
.sheet .sh{position:sticky;top:0;z-index:3;background:var(--paper);margin:0 -18px;padding:22px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .sh::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet .sh h2{font-size:1.2rem}
.sheet > .btn:last-child,.sheet > .actions:last-child{position:sticky;bottom:0;z-index:3;box-shadow:0 -14px 14px var(--paper)}
.sheet > .btn:last-child{width:100%;min-height:50px}
.sheet > .actions:last-child{background:var(--paper);padding-block:8px 0}
.sheet > .actions:last-child .btn{flex:1;min-height:50px}
.presets button{min-height:38px}
.empty{padding:32px 20px;box-shadow:none}
.empty .lead{margin:0;color:var(--muted);max-width:40ch}
@media (prefers-reduced-motion:reduce){.nota,.btn{transition:none}.nota:active,.btn:active{transform:none}}
/* ---- Fitur pelanggan v3 ---- */
input[type=tel]{font:inherit;font-size:16px;min-height:46px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.small{font-size:.8rem}
.field small{font-size:.78rem}
.iconbtn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.chip.draft{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.due{background:var(--accent);color:var(--accent-ink)}
.nota .side{display:grid;gap:6px;justify-items:end}
.nota.is-due{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lockmini{color:var(--muted);display:inline-flex}
.lockmini svg{width:16px;height:16px}
.label.sec{margin:22px 0 10px}
.pagehead + .stats + .label.sec,.pagehead + .stats + .alert{margin-top:0}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.alert svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:1px}
.alert b{display:block}
.alert span{font-size:.85rem;color:var(--muted)}
.backup-due{margin-top:12px}
.hero-empty{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:grid;gap:12px;justify-items:center;text-align:center;margin-top:8px}
.hero-empty h2{font-size:1.45rem}
.hero-empty .lead{margin:0;color:var(--muted);max-width:40ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-bottom:6px}
.steps3 div{background:var(--bg);border-radius:12px;padding:12px 8px;display:grid;gap:4px;justify-items:center}
.steps3 span{width:28px;height:28px;border-radius:50%;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.steps3 b{font-size:.82rem;line-height:1.2}
.steps3 small{font-size:.7rem;color:var(--muted);line-height:1.2}
.btn.big{width:100%;min-height:52px;font-size:1rem}

<header class="appbar"><div class="appbar-in">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg></span>
    <div style="min-width:0"><div class="brand-t">Cek Cucian</div><div class="brand-s">Catatan pribadi cucian Anda</div></div></div>

<script>
(function(){
"use strict";
/* ================= Data dasar ================= */
const JENIS=["Kaos","Kemeja","Celana panjang","Celana pendek","Rok","Gamis/Daster","Jaket","Seragam","Handuk","Sprei","Sarung bantal","Selimut","Kaus kaki","Pakaian dalam","Mukena/Sarung","Lainnya"];
const RAWAT=["Cuci terpisah (luntur)","Jangan disetrika","Setrika saja","Cuci tangan","Jangan dikeringkan mesin","Dry clean"];
const MASALAH=["Hilang","Tertukar","Luntur","Robek","Noda belum hilang","Masih bau","Kancing lepas","Menyusut"];
const LS_KEY="cekcucian.v1", LB_KEY="cekcucian.lastBackup", OB_KEY="cekcucian.onboard";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=s=>{if(!s)return"–";const d=new Date(s+"T00:00:00");if(isNaN(d))return s;return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})};
const fmtDT=t=>new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const rupiah=n=>n?("Rp "+Number(n).toLocaleString("id-ID")):"–";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  shirt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 19h14"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.2-.5-.4z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>'
};

/* ================= Penyimpanan ================= */
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{const r=indexedDB.open("cekcucian",1);r.onupgradeneeded=()=>r.result.createObjectStore("foto");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("foto",mode);const s=t.objectStore("foto");const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const store={batches:[],cache:new Map()};
function load(){try{store.batches=JSON.parse(lsGet(LS_KEY,"[]"))||[]}catch(e){store.batches=[]}}
function persist(){if(!lsSet(LS_KEY,JSON.stringify(store.batches))){toast("Memori browser penuh. Hapus kiriman lama atau cadangkan lalu bersihkan.");return false}return true}
function saveBatch(b){b.diubah=Date.now();const i=store.batches.findIndex(x=>x.id===b.id);if(i<0)store.batches.unshift(b);else store.batches[i]=b;persist();render()}
function allRefs(b){const r=[...(b.fotoUmum||[])];for(const it of b.items||[]){r.push(...(it.foto||[]),...(it.cekFoto||[]))}return r}
async function deleteBatch(b){store.batches=store.batches.filter(x=>x.id!==b.id);persist();for(const r of allRefs(b))await deletePhoto(r)}
async function deletePhoto(r){try{if(r&&r.i)await idbDo("readwrite",s=>s.delete(r.i))}catch(e){}}

/* Foto: dikecilkan + cap waktu */
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("File bukan gambar"));i.src=url});
    const max=1400,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);
    const fs=Math.max(14,Math.round(c.width/30)),pad=Math.round(fs*.6);
    const stamp=fmtDT(Date.now())+" · Cek Cucian";
    g.font=`600 ${fs}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const tw=g.measureText(stamp).width;
    g.fillStyle="rgba(0,0,0,.55)";g.fillRect(c.width-tw-pad*3,c.height-fs-pad*3,tw+pad*2,fs+pad*2);
    g.fillStyle="#fff";g.textBaseline="top";g.fillText(stamp,c.width-tw-pad*2,c.height-fs-pad*2);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.8));
  }finally{URL.revokeObjectURL(url)}
}
async function savePhoto(file){
  const blob=await compress(file);const id=uid();
  await idbDo("readwrite",s=>s.put(blob,id));
  store.cache.set(id,URL.createObjectURL(blob));
  return {i:id};
}
function photoSrc(r){
  if(!r||!r.i)return null;
  if(store.cache.has(r.i))return store.cache.get(r.i);
  store.cache.set(r.i,null);
  idbDo("readonly",s=>s.get(r.i)).then(b=>{if(b){store.cache.set(r.i,URL.createObjectURL(b));refreshImages()}}).catch(()=>{});
  return null;
}
let refreshT;function refreshImages(){clearTimeout(refreshT);refreshT=setTimeout(()=>{if(sheetRedraw)sheetRedraw();if(!sheetOpen)render()},60)}

/* ================= Status & bantuan ================= */
const ui={view:"list",id:null,tab:"catatan"};
let sheetOpen=false,sheetRedraw=null;
function counts(b){
  let pcs=0,ok=0,bad=0,okPcs=0;const items=b.items||[];
  for(const it of items){const n=Number(it.jumlah)||1;pcs+=n;if(it.cek==="ok"){ok++;okPcs+=n}else if(it.cek==="masalah")bad++}
  return {n:items.length,pcs,ok,bad,okPcs,done:ok+bad};
}
const selesaiCek=b=>{const c=counts(b);return c.n>0&&c.done===c.n};
function dueInfo(b){
  if(!b.tglAmbil||selesaiCek(b)||!b.dikunci)return null;
  const d=Math.round((new Date(b.tglAmbil+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
  if(d<0)return {cls:"bad",txt:`Terlambat ${-d} hari`,rank:0};
  if(d===0)return {cls:"due",txt:"Ambil hari ini",rank:1};
  if(d===1)return {cls:"wait",txt:"Ambil besok",rank:2};
  return {cls:"wait",txt:`Ambil ${d} hari lagi`,rank:3};
}
function statusChip(b){
  const c=counts(b);
  if(selesaiCek(b))return c.bad?`<span class="chip bad">${c.bad} bermasalah</span>`:`<span class="chip ok">Lengkap</span>`;
  if(c.done)return`<span class="chip wait">Dicek ${c.done}/${c.n}</span>`;
  if(!b.dikunci)return`<span class="chip draft">Belum diantar</span>`;
  const d=dueInfo(b);
  return d?`<span class="chip ${d.cls}">${d.txt}</span>`:`<span class="chip wait">Di laundry</span>`;
}
function waNumber(s){let d=String(s||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("0"))d="62"+d.slice(1);else if(d.startsWith("8"))d="62"+d;return d}
function openWA(num,text){
  const url=(num?`https://wa.me/${num}`:"https://wa.me/")+"?text="+encodeURIComponent(text);
  const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
}
function current(){return store.batches.find(b=>b.id===ui.id)}
function go(view,id,tab){ui.view=view;ui.id=id||null;if(tab)ui.tab=tab;render();window.scrollTo(0,0)}
function knownLaundries(){const m=new Map();for(const b of [...store.batches].sort((a,b)=>(a.diubah||0)-(b.diubah||0)))if(b.laundry&&b.laundry!=="Laundry")m.set(b.laundry,b.wa||"");return m}

/* ================= Teks WhatsApp ================= */
function daftarText(b){
  const c=counts(b);
  const L=[`*Daftar cucian saya*`,`Laundry: ${b.laundry||"-"}`];
  if(b.nota)L.push(`No. nota: ${b.nota}`);
  L.push(`Diantar: ${b.dikunci?fmtDT(b.dikunci):fmtDate(b.tglAntar)}`);
  if(b.tglAmbil)L.push(`Janji ambil: ${fmtDate(b.tglAmbil)}`);
  L.push("");
  (b.items||[]).forEach((it,i)=>{
    L.push(`${i+1}. ${it.jenis}${it.warna?" – "+it.warna:""} ×${it.jumlah||1}`);
    if(it.catatan)L.push(`   Kondisi awal: ${it.catatan}`);
    if((it.perawatan||[]).length)L.push(`   Perawatan: ${it.perawatan.join(", ")}`);
  });
  L.push("",`*Total: ${c.pcs} pcs (${c.n} jenis)*`,"","Mohon dicek kesesuaiannya. Terima kasih.","_Dicatat dengan Cek Cucian, lengkap dengan foto._");
  return L.join("\n");
}
function masalahText(b){
  const c=counts(b);
  const L=[`*Laporan pengecekan cucian*`,`Laundry: ${b.laundry||"-"}${b.nota?" · nota "+b.nota:""}`,`Diantar: ${b.dikunci?fmtDT(b.dikunci):fmtDate(b.tglAntar)} · total ${c.pcs} pcs`,"","Barang tidak sesuai:"];
  (b.items||[]).filter(i=>i.cek==="masalah").forEach(i=>{
    const k=(i.cekJumlah!=null&&i.cekJumlah!=="")?` – kembali ${i.cekJumlah} dari ${i.jumlah||1}`:"";
    L.push(`- ${i.jenis}${i.warna?" ("+i.warna+")":""} ×${i.jumlah||1}${k}${i.cekCatatan?". "+i.cekCatatan:""}`);
  });
  L.push("","Saya punya foto barang sebelum diantar dan bisa saya kirimkan. Mohon ditindaklanjuti. Terima kasih.");
  return L.join("\n");
}

/* ================= Tampilan daftar ================= */
function render(){
  const v=$("#view");
  if(ui.view==="batch"){const b=current();if(b){v.innerHTML=renderBatch(b);bindBatch(b);return}ui.view="list"}
  v.innerHTML=renderList();bindList();
}
function cardHTML(b){
  const c=counts(b),pct=c.n?Math.round(c.done/c.n*100):0,d=dueInfo(b);
  return `<button class="nota ${d&&d.rank<=1?"is-due":""}" data-open="${esc(b.id)}">
    <div class="hang"><b>${c.pcs}</b>pcs</div>
    <div class="meta"><h3>${esc(b.laundry||"Laundry")}</h3>
      <p>${b.dikunci?"Diantar":"Dibuat"} ${esc(fmtDate(b.tglAntar))}${b.tglAmbil?` · Ambil ${esc(fmtDate(b.tglAmbil))}`:""}${b.nota?` · <span class="mono">#${esc(b.nota)}</span>`:""}</p>
      ${c.done&&c.done<c.n?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}
    </div>
    <div class="side">${statusChip(b)}${b.dikunci?`<span class="lockmini" title="Catatan dikunci">${ICON.lock}</span>`:""}</div>
  </button>`;
}
function renderList(){
  let h="";
  if(!store.batches.length){
    h+=`<div class="hero-empty">
      <div class="steps3">
        <div><span>1</span><b>Foto & catat</b><small>Sebelum diantar</small></div>
        <div><span>2</span><b>Kirim ke laundry</b><small>Lewat WhatsApp</small></div>
        <div><span>3</span><b>Cek saat ambil</b><small>Cocokkan satu per satu</small></div>
      </div>
      <h2>Cucian Anda, tercatat lengkap</h2>
      <p class="lead">Catat dan foto baju sebelum dibawa ke laundry mana saja. Saat mengambil, cocokkan dengan catatan supaya tidak ada yang hilang atau tertukar.</p>
      <button class="btn primary big" data-act="new">${ICON.plus}Catat cucian pertama</button>
      <button class="btn ghost" data-act="restore">${ICON.upload}Pindahan dari HP lain? Pulihkan cadangan</button>
    </div>`;
    h+=installCard();
    return h;
  }
  const kunci=store.batches.filter(b=>b.dikunci&&!selesaiCek(b)).sort((a,b)=>{const x=dueInfo(a),y=dueInfo(b);return (x?x.rank:4)-(y?y.rank:4)||(a.tglAmbil||"9").localeCompare(b.tglAmbil||"9")});
  const draft=store.batches.filter(b=>!b.dikunci&&!selesaiCek(b));
  const done=store.batches.filter(selesaiCek);
  const pcsBelum=kunci.reduce((s,b)=>{const c=counts(b);return s+c.pcs-c.okPcs},0);
  const masalah=store.batches.reduce((s,b)=>s+counts(b).bad,0);
  const due=kunci.filter(b=>{const d=dueInfo(b);return d&&d.rank<=1});
  h+=`<div class="pagehead"><h1>Cucian saya</h1><p class="muted">${store.batches.length} kiriman tercatat</p></div>
    <div class="stats"><div><b>${kunci.length}</b><span>Di laundry</span></div><div><b>${pcsBelum}</b><span>Pcs belum kembali</span></div><div class="${masalah?"warn":""}"><b>${masalah}</b><span>Bermasalah</span></div></div>`;
  if(due.length)h+=`<div class="alert">${ICON.clock}<div><b>${due.length===1?esc(due[0].laundry)+": "+dueInfo(due[0]).txt.toLowerCase():due.length+" kiriman perlu diambil"}</b><span>Jangan lupa cek cucian saat mengambil.</span></div></div>`;
  if(lsGet(LS_KEY)&&backupDue()&&store.batches.length>=1)h+=`<div class="note backup-due"><div><b>${lastBackup()?"Sudah "+daysSince(lastBackup())+" hari belum dicadangkan.":"Catatan belum pernah dicadangkan."}</b> Data hanya ada di HP ini. Simpan cadangan supaya aman kalau HP rusak atau ganti HP.</div><button class="btn" data-act="backup">${ICON.save}Cadangkan sekarang</button></div>`;
  if(draft.length)h+=`<div class="label sec">Belum diantar · ${draft.length}</div><div class="list">${draft.map(cardHTML).join("")}</div>`;
  if(kunci.length)h+=`<div class="label sec">Di laundry · ${kunci.length}</div><div class="list">${kunci.map(cardHTML).join("")}</div>`;
  if(done.length)h+=`<div class="label sec">Sudah diambil & dicek · ${done.length}</div><div class="list">${done.map(cardHTML).join("")}</div>`;
  h+=installCard();
  const lb=lastBackup();
  h+=`<section class="backup"><div><h3>Cadangan data</h3>
    <p class="muted">${lb?`Terakhir dicadangkan ${esc(fmtDT(lb))}.`:"Belum pernah dicadangkan."} Catatan dan foto tersimpan di HP ini saja. File cadangan bisa disimpan di Google Drive atau WhatsApp, lalu dipulihkan di HP lain.</p></div>
    <div class="actions" style="margin:0"><button class="btn primary" data-act="backup">${ICON.save}Cadangkan</button><button class="btn" data-act="restore">${ICON.upload}Pulihkan dari file</button></div></section>`;
  h+=`<div class="bottombar"><div class="bb-in"><button class="btn primary" data-act="new">${ICON.plus}Catat cucian baru</button></div></div>`;
  return h;
}

let deferredPrompt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!sheetOpen)render()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("Aplikasi terpasang di layar utama");render()});
function installCard(){
  if(isStandalone()||lsGet("cekcucian.noinstall"))return"";
  if(!deferredPrompt&&!isIOS())return"";
  return `<div class="install">${ICON.phone}<div><b>Pasang di layar utama</b><span>${deferredPrompt?"Buka Cek Cucian seperti aplikasi biasa, tanpa mengetik alamat.":"Di Safari, tekan tombol Bagikan lalu pilih <b>Tambah ke Layar Utama</b>."}</span></div>${deferredPrompt?`<button class="btn primary" data-act="install">Pasang</button>`:""}</div>`;
}

function tagsHTML(it){return (it.perawatan||[]).length?`<div class="tags">${it.perawatan.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
function renderBatch(b){

    ${(b.riwayat||[]).length?`<ul class="log">${b.riwayat.map(r=>`<li><span class="mono">${esc(fmtDT(r.t))}</span> ${esc(r.teks)}</li>`).join("")}</ul>`:""}
    <div id="confirmzone"></div></div>`;
  return h;

      items:(b.items||[]).map(i=>({id:uid(),jenis:i.jenis,warna:i.warna||"",jumlah:i.jumlah||1,catatan:"",perawatan:[...(i.perawatan||[])],foto:[],cek:null}))};

function confirmInline(msg,yes,danger,fn){

async function copyText(t,okMsg){

function openSheet(html,onOpen){
  sheetOpen=true;sheetRedraw=null;

  ov.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=ov.firstElementChild;
  scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});

  onOpen&&onOpen(ov.querySelector(".sheet"));
}
function closeSheet(){sheetOpen=false;sheetRedraw=null;$("#overlay").innerHTML="";render()}
function hideSheet(){sheetOpen=false;sheetRedraw=null;$("#overlay").innerHTML=""}

let pickCb=null;
function pickPhotos(cb,camera){pickCb=cb;(camera?$("#fileIn"):$("#fileInGallery")).click()}
$("#fileIn").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";pickCb&&pickCb(f)});
$("#fileInGallery").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";pickCb&&pickCb(f)});

/* Komponen pengelola foto di dalam lembar isian */
function photoField(arr,elId,onBusy){
  let busy=0;const removed=[];
  const draw=()=>{
    const ph=$("#"+elId);if(!ph)return;
    ph.innerHTML=arr.map((r,i)=>{const s=photoSrc(r);return `<div class="ph">${s?`<img src="${esc(s)}" alt="Foto ${i+1}">`:""}<button data-rm="${i}" aria-label="Hapus foto ${i+1}">✕</button></div>`}).join("")
      +Array.from({length:busy},()=>`<div class="ph loading"></div>`).join("")
      +`<button class="addph" data-cam="1">${ICON.cam}Kamera</button><button class="addph" data-cam="0">${ICON.img}Galeri</button>`;
    ph.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{removed.push(...arr.splice(+x.dataset.rm,1));draw()});
    ph.querySelectorAll("[data-cam]").forEach(x=>x.onclick=()=>pickPhotos(handle,x.dataset.cam==="1"));
    onBusy&&onBusy(busy>0);
  };
  async function handle(files){for(const f of files){busy++;draw();try{arr.push(await savePhoto(f))}catch(e){toast("Foto gagal disimpan: "+(e&&e.message||"coba lagi"))}finally{busy--;draw()}}}
  return {draw,removed,busy:()=>busy>0};
}

    <div class="grid2">
      <div class="field"><label for="fNota">No. nota (opsional)</label><input type="text" id="fNota" value="${esc(d.nota)}" placeholder="mis. 0412"></div>
      <div class="field"><label for="fBerat">Berat kg (opsional)</label><input type="number" step="0.1" min="0" inputmode="decimal" id="fBerat" value="${esc(d.berat)}"></div>
    </div>
    <div class="field"><label for="fHarga">Harga Rp (opsional)</label><input type="number" min="0" step="500" inputmode="numeric" id="fHarga" value="${esc(d.harga)}"></div>
    <div class="field"><label for="fCat">Catatan (opsional)</label><textarea id="fCat" placeholder="mis. Paket express 1 hari">${esc(d.catatan)}</textarea></div>
    <button class="btn primary" id="fSave">${isNew?"Lanjut catat baju":"Simpan"}</button>`,()=>{
      $("#fLaundry").addEventListener("change",()=>{const w=known.get($("#fLaundry").value.trim());if(w&&!$("#fWa").value)$("#fWa").value=w});
      $("#fSave").onclick=()=>{
        const nb=b||{id:uid(),items:[],fotoUmum:[],dibuat:Date.now()};
        nb.laundry=$("#fLaundry").value.trim()||"Laundry";nb.wa=$("#fWa").value.trim();
        nb.tglAntar=$("#fAntar").value||today();nb.tglAmbil=$("#fAmbil").value;
        nb.nota=$("#fNota").value.trim();nb.berat=$("#fBerat").value;nb.harga=$("#fHarga").value;nb.catatan=$("#fCat").value.trim();
        hideSheet();ui.view="batch";ui.id=nb.id;if(isNew)ui.tab="catatan";
        saveBatch(nb);window.scrollTo(0,0);
        if(isNew)setTimeout(()=>openStartChoice(nb),60);
      };
    });
}
function openStartChoice(b){
  openSheet(`<div class="sh"><h2>Cara mencatat</h2><button class="btn ghost" data-close>Nanti</button></div>
    <button class="choice" id="chQuick">${ICON.bolt}<div><b>Isi cepat</b><span>Ketuk jumlah per jenis baju dan ambil satu foto tumpukan. Cocok untuk cucian kiloan yang banyak.</span></div></button>
    <button class="choice" id="chOne">${ICON.cam}<div><b>Satu per satu dengan foto</b><span>Foto dan catat tiap baju beserta warna dan kondisinya. Cocok untuk baju berharga.</span></div></button>
    <p class="muted small" style="margin:0">Keduanya bisa digabung kapan saja.</p>`,()=>{
      $("#chQuick").onclick=()=>{hideSheet();openQuickSheet(b)};
      $("#chOne").onclick=()=>{hideSheet();openItemSheet(b,null)};
    });
}
function openQuickSheet(b){
  const cnt={};const fu=b.fotoUmum=b.fotoUmum||[];
  const pf=photoField(fu,"qPhs",busy=>{const s=$("#qSave");if(s)s.disabled=busy});
  const total=()=>Object.values(cnt).reduce((s,n)=>s+n,0);
  openSheet(`<div class="sh"><h2>Isi cepat</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="field"><label>Foto tumpukan (opsional)</label><div class="photos" id="qPhs"></div></div>
    <div class="field"><label>Jumlah per jenis</label><div class="qgrid">${JENIS.filter(j=>j!=="Lainnya").map(j=>`<div class="qrow" data-j="${esc(j)}"><span>${esc(j)}</span><div class="qstep"><button type="button" data-d="-1" aria-label="Kurangi ${esc(j)}">−</button><b>0</b><button type="button" data-d="1" aria-label="Tambah ${esc(j)}">+</button></div></div>`).join("")}</div></div>
    <button class="btn primary" id="qSave">Tambahkan 0 pcs</button>`,()=>{
      pf.draw();sheetRedraw=pf.draw;
      $$(".qrow").forEach(r=>r.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
        const j=r.dataset.j;cnt[j]=Math.max(0,(cnt[j]||0)+(+btn.dataset.d));
        r.querySelector("b").textContent=cnt[j];r.classList.toggle("on",cnt[j]>0);
        $("#qSave").textContent=`Tambahkan ${total()} pcs`;
      }));
      $("#qSave").onclick=()=>{
        if(pf.busy())return;
        for(const [j,n] of Object.entries(cnt)){if(!n)continue;
          const ex=b.items.find(i=>i.jenis===j&&!i.warna&&!(i.foto||[]).length&&!i.catatan);
          if(ex)ex.jumlah=(Number(ex.jumlah)||0)+n;else b.items.push({id:uid(),jenis:j,warna:"",jumlah:n,catatan:"",perawatan:[],foto:[],cek:null});
        }
        pf.removed.forEach(deletePhoto);
        hideSheet();ui.tab="catatan";saveBatch(b);if(total())toast(`${total()} pcs ditambahkan`);
      };
    });
}
function openItemSheet(b,it){
  const isNew=!it;
  const d=it?JSON.parse(JSON.stringify(it)):{id:uid(),jenis:"",warna:"",jumlah:1,catatan:"",perawatan:[],foto:[],cek:null};
  d.perawatan=d.perawatan||[];
  const pf=photoField(d.foto,"phs",busy=>{["iSave","iSaveNext"].forEach(id=>{const s=$("#"+id);if(s)s.disabled=busy})});
  openSheet(`<div class="sh"><h2>${isNew?"Tambah baju":"Ubah baju"}</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="field"><label>Foto</label><div class="photos" id="phs"></div></div>
    <div class="field"><label for="iJenis">Jenis</label>
      <div class="presets" id="presets">${JENIS.map(j=>`<button type="button" class="${d.jenis===j?"on":""}">${esc(j)}</button>`).join("")}</div>
      <input type="text" id="iJenis" value="${esc(d.jenis)}" placeholder="atau ketik sendiri"></div>
    <div class="field"><label for="iWarna">Warna / merek / ciri</label><input type="text" id="iWarna" value="${esc(d.warna)}" placeholder="mis. Biru dongker, ada logo di dada"></div>
    <div class="field"><label for="iJml">Jumlah</label><div class="stepper"><button type="button" id="iMin" aria-label="Kurangi">−</button><input type="number" min="1" inputmode="numeric" id="iJml" value="${esc(d.jumlah||1)}"><button type="button" id="iPlus" aria-label="Tambah">+</button><span class="muted">pcs</span></div></div>
    <div class="field"><label for="iCat">Kondisi sebelum dicuci</label><textarea id="iCat" placeholder="mis. Noda kopi di lengan kanan, kancing kedua longgar">${esc(d.catatan)}</textarea></div>
    <div class="field"><label>Pesan perawatan untuk laundry</label><div class="presets" id="rawat">${RAWAT.map(r=>`<button type="button" class="${d.perawatan.includes(r)?"on":""}" aria-pressed="${d.perawatan.includes(r)}">${esc(r)}</button>`).join("")}</div></div>
    <div class="actions" style="margin:0">
      <button class="btn primary" id="iSave">${isNew?"Simpan baju":"Simpan perubahan"}</button>
      ${isNew?`<button class="btn" id="iSaveNext">${ICON.plus}Tambah lagi</button>`:`<button class="btn danger" id="iDel">Hapus</button>`}
    </div>`,()=>{
      pf.draw();sheetRedraw=pf.draw;
      $$("#presets button").forEach(x=>x.onclick=()=>{$$("#presets button").forEach(y=>y.classList.remove("on"));x.classList.add("on");$("#iJenis").value=x.textContent});
      $("#iJenis").oninput=()=>$$("#presets button").forEach(y=>y.classList.toggle("on",y.textContent===$("#iJenis").value));
      $$("#rawat button").forEach(x=>x.onclick=()=>{const on=!x.classList.contains("on");x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});
      $("#iMin").onclick=()=>{$("#iJml").value=Math.max(1,(+$("#iJml").value||1)-1)};
      $("#iPlus").onclick=()=>{$("#iJml").value=(+$("#iJml").value||0)+1};
      const commit=next=>{
        if(pf.busy())return;
        d.jenis=$("#iJenis").value.trim()||"Pakaian";d.warna=$("#iWarna").value.trim();
        d.jumlah=Math.max(1,parseInt($("#iJml").value,10)||1);d.catatan=$("#iCat").value.trim();
        d.perawatan=$$("#rawat button.on").map(x=>x.textContent);
        const i=b.items.findIndex(x=>x.id===d.id);if(i<0)b.items.push(d);else b.items[i]=d;
        pf.removed.forEach(deletePhoto);
        hideSheet();ui.tab="catatan";saveBatch(b);
        if(next)setTimeout(()=>openItemSheet(b,null),30);else toast("Baju dicatat");
      };
      $("#iSave").onclick=()=>commit(false);
      const nx=$("#iSaveNext");if(nx)nx.onclick=()=>commit(true);
      const del=$("#iDel");if(del)del.onclick=()=>{
        del.outerHTML=`<button class="btn danger" id="iDelYes">Yakin hapus?</button>`;
        $("#iDelYes").onclick=()=>{b.items=b.items.filter(x=>x.id!==d.id);(it.foto||[]).forEach(deletePhoto);hideSheet();saveBatch(b)};
      };
    });
}
function openLockSheet(b){
  const c=counts(b),num=waNumber(b.wa);
  openSheet(`<div class="sh"><h2>Antar & kunci catatan</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="locksum"><div><b class="mono">${c.pcs}</b><span>pcs</span></div><div><b class="mono">${c.n}</b><span>jenis</span></div><div><b class="mono">${allRefs(b).length}</b><span>foto</span></div></div>
    <p style="margin:0">Setelah dikunci, daftar barang tidak bisa diubah dan waktu antar tercatat. Kirim daftar ini ke laundry supaya mereka punya catatan yang sama dengan Anda.</p>
    ${num?"":`<div class="field"><label for="lWa">No. WhatsApp laundry (opsional)</label><input type="tel" id="lWa" inputmode="tel" placeholder="mis. 0812 3456 7890"><small class="muted">Kosongkan untuk memilih kontak sendiri di WhatsApp.</small></div>`}
    <details class="preview"><summary>Lihat pesan yang akan dikirim</summary><pre>${esc(daftarText(Object.assign({},b,{dikunci:Date.now()})))}</pre></details>
    <div class="actions" style="margin:0">
      <button class="btn primary" id="lSend">${ICON.wa}Kunci & kirim WhatsApp</button>
      <button class="btn" id="lOnly">${ICON.lock}Kunci saja</button>
    </div>`,()=>{
      const doLock=()=>{const w=$("#lWa");if(w&&w.value.trim())b.wa=w.value.trim();b.dikunci=Date.now();logEvent(b,"Catatan dikunci saat antar");hideSheet();saveBatch(b)};
      $("#lSend").onclick=()=>{doLock();openWA(waNumber(b.wa),daftarText(b));toast("Catatan dikunci")};
      $("#lOnly").onclick=()=>{doLock();toast("Catatan dikunci")};
    });
}
function openIssueSheet(b,it){
  const after=it.cekFoto=it.cekFoto||[];const before=it.foto||[];
  const pf=photoField(after,"kPhs",busy=>{const s=$("#kSave");if(s)s.disabled=busy});
  openSheet(`<div class="sh"><h2>Ada masalah: ${esc(it.jenis)}</h2><button class="btn ghost" data-close>Batal</button></div>
    ${before.length?`<div class="field"><label>Foto sebelum diantar</label><div class="photos">${before.map(r=>{const s=photoSrc(r);return `<div class="ph">${s?`<img src="${esc(s)}" alt="">`:""}</div>`}).join("")}</div></div>`:""}
    <div class="field"><label>Foto kondisi sekarang (bukti)</label><div class="photos" id="kPhs"></div></div>
    <div class="field"><label for="kJml">Jumlah yang kembali (dari ${esc(it.jumlah||1)})</label><input type="number" min="0" inputmode="numeric" id="kJml" value="${esc(it.cekJumlah??"")}" placeholder="mis. ${Math.max(0,(it.jumlah||1)-1)}"></div>
    <div class="field"><label>Masalah</label><div class="presets" id="kPre">${MASALAH.map(x=>`<button type="button">${x}</button>`).join("")}</div></div>
    <div class="field"><label for="kCat">Keterangan</label><textarea id="kCat" placeholder="mis. Kemeja putih berubah jadi kebiruan">${esc(it.cekCatatan||"")}</textarea></div>
    <button class="btn danger" id="kSave">Tandai bermasalah</button>`,()=>{
      pf.draw();sheetRedraw=pf.draw;
      $$("#kPre button").forEach(x=>x.onclick=()=>{const t=$("#kCat");t.value=t.value?(t.value.replace(/[\s,]+$/,"")+", "+x.textContent.toLowerCase()):x.textContent});
      $("#kSave").onclick=()=>{
        if(pf.busy())return;
        it.cek="masalah";const v=$("#kJml").value;it.cekJumlah=v===""?null:Math.max(0,parseInt(v,10)||0);
        it.cekCatatan=$("#kCat").value.trim();pf.removed.forEach(deletePhoto);hideSheet();saveBatch(b);
      };
    });
}
function lightbox(refs,i){
  const ov=$("#overlay");sheetOpen=true;
  const show=()=>{const s=photoSrc(refs[i]);
    ov.innerHTML=`<div class="lightbox" role="dialog" aria-label="Foto">${s?`<img src="${esc(s)}" alt="Foto ${i+1} dari ${refs.length}">`:""}${refs.length>1?`<span class="lb-n">${i+1} / ${refs.length} · ketuk foto untuk berikutnya</span>`:""}<button class="btn">Tutup</button></div>`;
    ov.firstElementChild.onclick=e=>{if(e.target.tagName==="IMG"&&refs.length>1){i=(i+1)%refs.length;show()}else{ov.innerHTML="";sheetOpen=false}};
  };sheetRedraw=show;show();
}

/* ================= Panduan pengguna baru ================= */
const SLIDES=[
  {t:"Foto & catat sebelum diantar",p:"Foto baju satu per satu, atau ketuk jumlah per jenis lalu ambil satu foto tumpukan. Catat juga noda atau kerusakan yang sudah ada.",ic:ICON.cam},
  {t:"Kirim daftar ke laundry",p:"Saat mengantar, kirim daftar lewat WhatsApp ke laundry. Catatan lalu dikunci, lengkap dengan waktu dan foto bercap tanggal, jadi bisa dipakai sebagai bukti.",ic:ICON.wa},
  {t:"Cek sebelum dibawa pulang",p:"Saat mengambil, cocokkan tiap barang. Kalau ada yang hilang atau rusak, foto kondisinya dan langsung laporkan ke laundry dari aplikasi.",ic:ICON.check}
];
function openOnboarding(){
  let i=0;
  const draw=()=>{
    const s=SLIDES[i],last=i===SLIDES.length-1;
    openSheet(`<div class="ob">
      <div class="ob-ic">${s.ic}</div>
      <div class="ob-dots">${SLIDES.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="label">Langkah ${i+1} dari ${SLIDES.length}</div>
      <h2>${esc(s.t)}</h2><p>${esc(s.p)}</p>
      ${last?`<p class="muted small">Semua catatan dan foto tersimpan di HP Anda sendiri, tidak dikirim ke mana pun. Tidak perlu daftar atau login.</p>`:""}
    </div>
    <div class="actions" style="margin:0">${i?`<button class="btn" id="obBack">Kembali</button>`:`<button class="btn ghost" id="obSkip">Lewati</button>`}<button class="btn primary" id="obNext">${last?"Mulai":"Lanjut"}</button></div>`,()=>{
      const end=()=>{lsSet(OB_KEY,"1");closeSheet()};
      $("#obNext").onclick=()=>{if(last)end();else{i++;draw()}};
      const bk=$("#obBack");if(bk)bk.onclick=()=>{i--;draw()};
      const sk=$("#obSkip");if(sk)sk.onclick=end;
    });
  };draw();
}
$("#helpBtn").onclick=openOnboarding;

/* ================= Cadangkan & pulihkan ================= */
function lastBackup(){return Number(lsGet(LB_KEY,0))||0}
function daysSince(t){return Math.max(1,Math.floor((Date.now()-t)/864e5))}
function backupDue(){const t=lastBackup();return !t||Date.now()-t>7*864e5}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
const sizeTxt=b=>b>1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";
async function buildBackup(){
  const foto={};let n=0;
  for(const b of store.batches)for(const r of allRefs(b)){
    if(r.i&&!foto[r.i]){const blob=await idbDo("readonly",s=>s.get(r.i));if(blob){foto[r.i]=await blobToDataURL(blob);n++}}
  }
  const blob=new Blob([JSON.stringify({app:"cek-cucian",versi:2,dibuat:new Date().toISOString(),kiriman:store.batches,foto})],{type:"application/json"});
  const name="cek-cucian-cadangan-"+today()+".json";
  return {blob,name,file:new File([blob],name,{type:"application/json"}),nFoto:n};
}
async function openBackupSheet(){
  openSheet(`<div class="sh"><h2>Cadangkan data</h2><button class="btn ghost" data-close>Tutup</button></div><p class="muted" id="bkInfo" style="margin:0">Menyiapkan file cadangan…</p><div class="actions" id="bkAct" style="margin:0"></div>`);
  let bk;try{bk=await buildBackup()}catch(e){$("#bkInfo").textContent="Gagal menyiapkan cadangan: "+(e&&e.message||"coba lagi");return}
  if(!$("#bkInfo"))return;
  $("#bkInfo").innerHTML=`<b>${store.batches.length} kiriman, ${bk.nFoto} foto</b> · ukuran ${esc(sizeTxt(bk.blob.size))}<br>Nama file: <span class="mono">${esc(bk.name)}</span><br><br>Pilih <b>Bagikan</b> untuk menyimpan ke Google Drive atau mengirim ke WhatsApp sendiri. Pilih <b>Unduh</b> untuk menyimpan ke folder Download.`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[bk.file]}));
  $("#bkAct").innerHTML=(canShare?`<button class="btn primary" id="bkShare">${ICON.share}Bagikan ke Drive / WhatsApp</button>`:"")+`<button class="btn ${canShare?"":"primary"}" id="bkDl">${ICON.save}Unduh file</button>`;
  const mark=()=>lsSet(LB_KEY,String(Date.now()));
  if(canShare)$("#bkShare").onclick=async()=>{try{await navigator.share({files:[bk.file],title:"Cadangan Cek Cucian"});mark();closeSheet();toast("Cadangan dibagikan")}catch(e){if(e&&e.name!=="AbortError")toast("Gagal membagikan. Coba Unduh file.")}};
  $("#bkDl").onclick=()=>{const url=URL.createObjectURL(bk.blob);const a=document.createElement("a");a.href=url;a.download=bk.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);mark();closeSheet();toast("File cadangan diunduh ke folder Download")};
}
$("#restoreIn").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=JSON.parse(await f.text())}catch(err){toast("File tidak bisa dibaca. Pilih file .json cadangan Cek Cucian.");return}
  if(!data||data.app!=="cek-cucian"||!Array.isArray(data.kiriman)){toast("Ini bukan file cadangan Cek Cucian.");return}
  const ada=new Map(store.batches.map(b=>[b.id,b]));let baru=0,upd=0,sama=0;
  for(const b of data.kiriman){const l=ada.get(b.id);if(!l)baru++;else if((b.diubah||0)>(l.diubah||0))upd++;else sama++}
  openSheet(`<div class="sh"><h2>Pulihkan data</h2><button class="btn ghost" data-close>Batal</button></div>
    <p style="margin:0">File dibuat <b>${esc(data.dibuat?fmtDT(Date.parse(data.dibuat)):"–")}</b>, berisi ${data.kiriman.length} kiriman dan ${Object.keys(data.foto||{}).length} foto.</p>
    <ul class="muted" style="margin:0;padding-left:20px"><li>${baru} kiriman baru akan ditambahkan</li><li>${upd} kiriman diganti dengan versi yang lebih baru</li><li>${sama} kiriman sudah ada dan tidak diubah</li></ul>
    <p class="muted" style="margin:0">Data lain di HP ini tetap aman.</p>
    <button class="btn primary" id="rsGo">${ICON.upload}Pulihkan</button>`,()=>{
      $("#rsGo").onclick=async()=>{
        const btn=$("#rsGo");btn.disabled=true;btn.textContent="Memulihkan…";
        try{
          for(const [id,u] of Object.entries(data.foto||{})){if(typeof u!=="string"||!u.startsWith("data:image/"))continue;const blob=await (await fetch(u)).blob();await idbDo("readwrite",s=>s.put(blob,id));store.cache.delete(id)}
          for(const b of data.kiriman){if(!b||typeof b.id!=="string")continue;const l=ada.get(b.id);if(!l)store.batches.push(b);else if((b.diubah||0)>(l.diubah||0))store.batches[store.batches.indexOf(l)]=b}
          store.batches.sort((a,b)=>(b.tglAntar||"").localeCompare(a.tglAntar||"")||(b.dibuat||0)-(a.dibuat||0));
          if(persist()){closeSheet();toast(`Dipulihkan: ${baru} kiriman baru, ${upd} diperbarui`)}
        }catch(err){toast("Gagal memulihkan: "+(err&&err.message||"coba lagi"));btn.disabled=false;btn.textContent="Pulihkan"}
      };
    });
});

let tt;function toast(m){clearTimeout(tt);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2800)}

/* ================= Mulai ================= */
load();render();
if(!lsGet(OB_KEY)&&!store.batches.length)setTimeout(openOnboarding,250);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
