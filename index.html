<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<title>Cek Cucian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: satu kolom ala nota laundry — daftar kiriman, lalu detail dengan tab Catatan / Cek ambil */
:root{
  --bg:#eef3f4; --paper:#ffffff; --ink:#15272d; --muted:#5c7178; --line:#d3dfe2;
  --accent:#0f7d8c; --accent-ink:#ffffff; --accent-soft:#d9eef1;
  --tag:#f7d55c; --tag-ink:#3d3205;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --bad:#c2412d; --bad-soft:#fbe3de; --wait:#9a6b00; --wait-soft:#fbefcc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --paper:#15252a; --ink:#e4eef0; --muted:#93a9af; --line:#273b41;
  --accent:#3fb6c6; --accent-ink:#06272c; --accent-soft:#163b42;
  --tag:#e5c24a; --tag-ink:#2a2203;
  --ok:#5fcf8c; --ok-soft:#173a26; --bad:#f08470; --bad-soft:#41201a; --wait:#e3b94f; --wait-soft:#3a2f12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sub{margin:6px 0 20px;color:var(--muted);max-width:60ch}
.note{font-size:.85rem;padding:10px 14px;border-radius:10px;background:var(--wait-soft);color:var(--ink);margin-bottom:16px}

/* nota card */
.list{display:grid;gap:14px}
.nota{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;color:inherit;width:100%}
.nota:hover{border-color:var(--accent)}
.hang{width:54px;min-height:64px;background:var(--tag);color:var(--tag-ink);border-radius:8px 8px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding-top:10px;font-family:var(--f-mono);font-size:.7rem;text-align:center;line-height:1.2}
.hang::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--paper)}
.hang b{font-size:1.25rem;font-family:var(--f-display);font-weight:800}
.nota .meta{min-width:0}
.nota .meta h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nota .meta p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty svg{width:64px;height:64px;color:var(--accent)}
.empty ol{text-align:left;margin:4px 0 8px;padding-left:20px;color:var(--muted);max-width:42ch}

/* detail */
.back{margin:-6px 0 10px -8px}
.head-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.facts div{min-width:0}
.facts .v{font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.item.st-ok{border-color:var(--ok)}
.item.st-bad{border-color:var(--bad)}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:6px}
.thumb svg{width:30px;height:30px}
.item .body{min-width:0;display:grid;gap:4px}
.item .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .desc{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.qty{font-family:var(--f-mono);font-weight:500;background:var(--bg);border-radius:8px;padding:2px 8px;font-size:.85rem}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.checks .btn{padding:7px 12px;font-size:.85rem}
.checks .btn.on-ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.checks .btn.on-bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.issue{font-size:.85rem;color:var(--bad);overflow-wrap:anywhere}
.summary{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;margin-bottom:14px}
.summary.ok{background:var(--ok-soft)}
.summary.bad{background:var(--bad-soft)}
.summary.wait{background:var(--accent-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px;font-size:.9rem;color:var(--muted)}

/* fab */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:20;box-shadow:0 6px 20px rgba(15,60,70,.25);padding:14px 20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.stepper input{width:70px;text-align:center}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:84px;height:84px;border-radius:10px;overflow:hidden;position:relative;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem;line-height:1}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:600}
.addph svg{width:24px;height:24px}
.ph.loading::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:1.4rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:calc(14px + env(safe-area-inset-right, 0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
.backup{margin-top:32px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.backup p{margin:4px 0 0;font-size:.88rem;max-width:60ch}
.backup-due{display:grid;gap:10px;justify-items:start}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---- Tampilan HP v2 ---- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.wrap{padding-block:16px 130px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:720px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo svg{width:22px;height:22px}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.1;letter-spacing:-.01em}
.brand-s{font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;flex:none}
@media (max-width:370px){.brand-s{display:none}}
.pagehead{display:grid;gap:2px;margin:6px 0 14px}
.pagehead h1{font-size:1.6rem}
.pagehead p{margin:0;font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.stats b{font-family:var(--f-display);font-size:1.55rem;font-weight:800;line-height:1.1}
.stats span{font-size:.72rem;color:var(--muted);line-height:1.25}
.stats .warn{background:var(--bad-soft);border-color:transparent}
.stats .warn b{color:var(--bad)}
.label{margin-bottom:2px}
.list{gap:10px}
.nota{padding:14px;gap:12px;box-shadow:0 1px 2px rgba(10,40,50,.05);transition:transform .12s, border-color .12s}
.nota .meta h3{font-size:1rem}
.nota .meta p{font-size:.8rem}
.btn{min-height:44px;transition:transform .12s, background .12s}
.nota:active,.btn:active{transform:scale(.98)}
.back{min-height:40px}
.head-card{padding:0;gap:0;overflow:hidden;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.head-card > .row{background:var(--accent);color:var(--accent-ink);padding:16px 18px 18px;position:relative}
.head-card > .row .label{color:inherit;opacity:.8}
.head-card > .row::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 6px,var(--paper) 4px,transparent 4.5px) 0 0/16px 12px repeat-x}
.head-card > .row .chip{background:var(--paper)}
.head-card > *:not(.row){margin:0 18px}
.head-card > .facts{margin-top:20px}
.head-card > p{margin-top:14px !important}
.head-card > div:last-child:not(.facts){margin-top:14px;margin-bottom:16px}
.head-card > .facts:last-child,.head-card > p:last-child{margin-bottom:18px !important}
.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:620px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:20;box-shadow:0 4px 14px rgba(10,40,50,.08)}
.tabs button{min-height:40px}
.item{grid-template-columns:84px 1fr;padding:12px;box-shadow:0 1px 2px rgba(10,40,50,.05)}
.item.st-ok{background:linear-gradient(var(--ok-soft),var(--ok-soft)) left/4px 100% no-repeat,var(--paper)}
.item.st-bad{background:linear-gradient(var(--bad-soft),var(--bad-soft)) left/4px 100% no-repeat,var(--paper)}
.thumb{width:84px;height:84px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks .btn{min-height:42px;padding:8px 10px}
.summary h3{font-size:1.05rem}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(10,40,50,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.bb-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.bb-in .btn{flex:1;min-height:48px;font-size:.95rem}
.bb-prog{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.bb-prog b{color:var(--ink);font-family:var(--f-mono)}
.bb-prog .bar{margin-top:6px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input[type=text],input[type=number],input[type=date],textarea{font-size:16px;min-height:46px}
.sheet{padding-top:0;gap:16px}
.sheet .sh{position:sticky;top:0;z-index:3;background:var(--paper);margin:0 -18px;padding:22px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .sh::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet .sh h2{font-size:1.2rem}
.sheet > .btn:last-child,.sheet > .actions:last-child{position:sticky;bottom:0;z-index:3;box-shadow:0 -14px 14px var(--paper)}
.sheet > .btn:last-child{width:100%;min-height:50px}
.sheet > .actions:last-child{background:var(--paper);padding-block:8px 0}
.sheet > .actions:last-child .btn{flex:1;min-height:50px}
.presets button{min-height:38px}
.empty{padding:32px 20px;box-shadow:none}
.empty .lead{margin:0;color:var(--muted);max-width:40ch}
@media (prefers-reduced-motion:reduce){.nota,.btn{transition:none}.nota:active,.btn:active{transform:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="appbar"><div class="appbar-in">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg></span>
    <div style="min-width:0"><div class="brand-t">Cek Cucian</div><div class="brand-s">Catatan sebelum ke laundry</div></div></div>
  <span class="sync" id="sync"><i></i><span>Memuat…</span></span>
</div></header>
<div class="wrap" id="app">
  <div id="view"></div>
</div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<input type="file" id="fileInGallery" accept="image/*" multiple hidden>
<div id="overlay"></div>

<script>
(function(){
"use strict";
const JENIS=["Kaos","Kemeja","Celana panjang","Celana pendek","Rok","Gamis/Daster","Jaket","Seragam","Handuk","Sprei","Sarung bantal","Selimut","Kaus kaki","Pakaian dalam","Mukena/Sarung","Lainnya"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=s=>{if(!s)return"–";const d=new Date(s+"T00:00:00");if(isNaN(d))return s;return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})};
const rupiah=n=>n?("Rp "+Number(n).toLocaleString("id-ID")):"–";
const ICON={

/* ---------- IndexedDB untuk foto (versi GitHub) ---------- */
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{const r=indexedDB.open("cekcucian",1);r.onupgradeneeded=()=>r.result.createObjectStore("foto");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("foto",mode);const s=t.objectStore("foto");const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
/* ---------- Storage layer: db + assets, fallback to browser ---------- */
const LS_KEY="cekcucian.v1";
const store={mode:"loading",batches:[],db:null,assets:null,photoCache:new Map(),canWrite:true};
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){return[]}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(store.batches));return true}catch(e){toast("Penyimpanan browser penuh. Hapus kiriman lama atau kurangi foto.");return false}}

const writing=new Map(), pending=new Map();
async function saveBatch(b){
  b.diubah=Date.now();
  const i=store.batches.findIndex(x=>x.id===b.id);
  if(i<0)store.batches.unshift(b);else store.batches[i]=b;
  render();
  if(store.mode!=="db"){lsWrite();return}
  pending.set(b.id,JSON.parse(JSON.stringify(b)));
  if(writing.get(b.id))return;
  writing.set(b.id,true);
  try{
    while(pending.has(b.id)){
      const data=pending.get(b.id);pending.delete(b.id);
      const {id,...body}=data;
      await store.db.collection("kiriman").doc(id).set(body);
    }
  }catch(e){
    toast(e&&e.code==="permission_denied"?"Anda hanya bisa melihat. Minta akses edit ke pemilik.":"Gagal menyimpan: "+(e&&e.message||"coba lagi"));
  }finally{writing.delete(b.id)}
}
async function deleteBatch(b){
  store.batches=store.batches.filter(x=>x.id!==b.id);
  if(store.mode==="db"){
    try{
      await store.db.collection("kiriman").doc(b.id).delete();
      for(const it of b.items||[])for(const r of it.foto||[])await deletePhoto(r);
    }catch(e){toast("Gagal menghapus: "+(e&&e.message||""))}
  } else lsWrite();
}
async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
  }finally{URL.revokeObjectURL(url)}
}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function savePhoto(file){
  if(store.mode==="db"&&store.assets){
    const blob=await compress(file,1400,.78);
    const a=await store.assets.upload(blob);
    store.photoCache.set("a:"+a.id,a.url);
    return {a:a.id};
  }
  if(store.mode==="db"){
    const blob=await compress(file,900,.62);
    const u=await blobToDataURL(blob);
    const ref=store.db.collection("foto").doc();
    await ref.set({u});
    store.photoCache.set("d:"+ref.id,u);
    return {d:ref.id};
  }
  const blob=await compress(file,1400,.78);
  const id=uid();
  await idbDo("readwrite",s=>s.put(blob,id));
  store.photoCache.set("i:"+id,URL.createObjectURL(blob));
  return {i:id};
}
async function deletePhoto(r){
  try{
    if(r.a&&store.assets)await store.assets.delete(r.a);
    if(r.d&&store.db)await store.db.collection("foto").doc(r.d).delete();
    if(r.i)await idbDo("readwrite",s=>s.delete(r.i));
  }catch(e){}
}
function photoSrc(r){
  if(!r)return null;
  if(r.u)return r.u;
  if(r.a)return store.photoCache.get("a:"+r.a)||("/_blob/"+r.a);
  if(r.i){
    const k="i:"+r.i;
    if(store.photoCache.has(k))return store.photoCache.get(k);
    store.photoCache.set(k,null);
    idbDo("readonly",s=>s.get(r.i)).then(b=>{if(b){store.photoCache.set(k,URL.createObjectURL(b));render()}}).catch(()=>{});
    return null;
  }
  if(r.d){
    const k="d:"+r.d;
    if(store.photoCache.has(k))return store.photoCache.get(k);
    store.photoCache.set(k,null);
    store.db&&store.db.collection("foto").doc(r.d).get().then(s=>{if(s.exists){store.photoCache.set(k,s.data().u);render()}}).catch(()=>{});
    return null;
  }
  return null;
}

async function boot(){
  let db=null,assets=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      [db,assets,user]=await Promise.all([window.claude.use("db"),window.claude.use("assets"),window.claude.use("user")]);
    }
  }catch(e){}
  if(!db){
    store.mode="local";store.batches=lsRead();setSync();render();return;
  }
  store.db=db;store.assets=assets;store.mode="db";
  if(user){try{const c=await user.can("data.write");if(c===false)store.canWrite=false}catch(e){}}
  let timer=setTimeout(()=>{setSync("Belum tersambung, data mungkin belum terbaru");},10000);
  db.collection("kiriman").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync()}
    store.loaded=true;
    store.batches=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}))
      .sort((a,b)=>(b.tglAntar||"").localeCompare(a.tglAntar||"")||(b.dibuat||0)-(a.dibuat||0));
    if(!sheetOpen)render();
  },err=>{clearTimeout(timer);setSync("Tidak bisa memuat data ("+(err&&err.code||"error")+")");store.loaded=true;render()});
  render();
}
function setSync(msg){
  const el=$("#sync");
  if(msg){el.className="sync";el.lastChild.textContent=msg;return}
  if(store.mode==="db"){el.className="sync on";el.lastChild.textContent="Tersimpan di akun"}
  else{el.className="sync on";el.lastChild.textContent="Tersimpan di HP ini"}
}

/* ---------- State & helpers ---------- */
const ui={view:"list",id:null,tab:"catatan"};
let sheetOpen=false;
function counts(b){
  const items=b.items||[];let pcs=0,ok=0,bad=0,okPcs=0;
  for(const it of items){const n=Number(it.jumlah)||1;pcs+=n;if(it.cek==="ok"){ok++;okPcs+=n}else if(it.cek==="masalah")bad++}
  return {n:items.length,pcs,ok,bad,okPcs,done:ok+bad};
}
function statusChip(b){
  const c=counts(b);
  if(c.n&&c.done===c.n)return c.bad?`<span class="chip bad">${c.bad} bermasalah</span>`:`<span class="chip ok">Lengkap</span>`;
  if(c.done)return`<span class="chip wait">Dicek ${c.done}/${c.n}</span>`;
  return`<span class="chip wait">Di laundry</span>`;
}
function current(){return store.batches.find(b=>b.id===ui.id)}
function go(view,id,tab){ui.view=view;ui.id=id||null;if(tab)ui.tab=tab;render();window.scrollTo(0,0)}

/* ---------- Render ---------- */
function render(){
  const v=$("#view");

}

        ${c.done&&c.done<c.n?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}

      <div style="display:grid;gap:6px;justify-items:end">${statusChip(b)}${b.contoh?'<span class="chip ex">Contoh</span>':""}</div>

  if(aktif.length)h+=`<div class="label" style="margin:4px 0 10px">Masih di laundry · ${aktif.length}</div><div class="list">${aktif.map(card).join("")}</div>`;

function bindList(){

function thumbHTML(it){

  return `<button class="thumb" data-photo="${esc(it.id)}" aria-label="Lihat foto ${esc(it.jenis)}">${src?`<img src="${esc(src)}" alt="">`:ICON.shirt}${f.length>1?`<span class="n">${f.length}</span>`:""}</button>`;
}
function renderBatch(b){

  return h;

function bindBatch(b){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  on('[data-act="back"]',()=>go("list"));
  on("[data-tab]",el=>{ui.tab=el.dataset.tab;render()});
  on('[data-act="editb"]',()=>openBatchSheet(b));
  on('[data-act="additem"]',()=>openItemSheet(b,null));
  on("[data-edit]",el=>openItemSheet(b,b.items.find(i=>i.id===el.dataset.edit)));
  on("[data-photo]",el=>{const it=b.items.find(i=>i.id===el.dataset.photo);if(it&&(it.foto||[]).length)lightbox(it.foto,0)});
  on("[data-ok]",el=>{const it=b.items.find(i=>i.id===el.dataset.ok);it.cek=it.cek==="ok"?null:"ok";it.cekJumlah=null;it.cekCatatan="";saveBatch(b)});
  on("[data-bad]",el=>openIssueSheet(b,b.items.find(i=>i.id===el.dataset.bad)));
  on('[data-act="resetcek"]',()=>{b.items.forEach(i=>{i.cek=null;i.cekJumlah=null;i.cekCatatan=""});saveBatch(b)});
  on('[data-act="copy"]',()=>copyText(summaryText(b)));
  on('[data-act="delb"]',()=>{
    const z=$("#delzone");
    z.innerHTML=`<div class="confirm" style="width:100%"><b>Hapus kiriman ${esc(b.laundry||"")} beserta semua foto?</b><span class="muted">Ini tidak bisa dibatalkan.</span>
      <div class="actions" style="margin:0"><button class="btn danger" id="delyes">Ya, hapus</button><button class="btn" id="delno">Batal</button></div></div>`;
    $("#delyes").onclick=async()=>{go("list");await deleteBatch(b);toast("Kiriman dihapus");render()};
    $("#delno").onclick=()=>render();
  });
}
function summaryText(b){
  const c=counts(b);
  const lines=[`Cek cucian – ${b.laundry||"Laundry"}${b.nota?" (nota #"+b.nota+")":""}`,`Diantar ${fmtDate(b.tglAntar)}, total ${c.pcs} pcs.`,"","Tidak sesuai:"];
  b.items.filter(i=>i.cek==="masalah").forEach(i=>{
    const kembali=(i.cekJumlah!=null&&i.cekJumlah!=="")?` – kembali ${i.cekJumlah} dari ${i.jumlah||1}`:"";
    lines.push(`- ${i.jenis}${i.warna?" ("+i.warna+")":""} ×${i.jumlah||1}${kembali}${i.cekCatatan?". "+i.cekCatatan:""}`);
  });
  return lines.join("\n");
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("Ringkasan disalin")}
  catch(e){
    openSheet(`<div class="sh"><h2>Salin ringkasan</h2><button class="btn ghost" data-close>Tutup</button></div>
      <p class="muted" style="margin:0">Tekan lama lalu pilih Salin.</p><textarea id="cp" rows="8" readonly>${esc(t)}</textarea>`);
    const ta=$("#cp");ta.focus();ta.select();
  }
}

/* ---------- Sheets ---------- */
function openSheet(html,onOpen){
  sheetOpen=true;
  const ov=$("#overlay");
  ov.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=ov.firstElementChild;
  scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});
  ov.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  onOpen&&onOpen(ov.querySelector(".sheet"));
  const f=ov.querySelector("input,textarea,button");f&&f.focus({preventScroll:true});
}
function closeSheet(){sheetOpen=false;$("#overlay").innerHTML="";render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#overlay").innerHTML)closeSheet()});

function openBatchSheet(b){
  const isNew=!b;
  const d=b||{laundry:"",nota:"",tglAntar:today(),tglAmbil:"",berat:"",harga:"",catatan:""};
  openSheet(`<div class="sh"><h2>${isNew?"Kiriman baru":"Ubah info kiriman"}</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="field"><label for="fLaundry">Nama laundry</label><input type="text" id="fLaundry" value="${esc(d.laundry)}" placeholder="mis. Laundry Bersih Jaya"></div>
    <div class="grid2">
      <div class="field"><label for="fAntar">Tanggal antar</label><input type="date" id="fAntar" value="${esc(d.tglAntar)}"></div>
      <div class="field"><label for="fAmbil">Janji ambil</label><input type="date" id="fAmbil" value="${esc(d.tglAmbil)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="fNota">No. nota (opsional)</label><input type="text" id="fNota" value="${esc(d.nota)}" placeholder="mis. 0412"></div>
      <div class="field"><label for="fBerat">Berat kg (opsional)</label><input type="number" step="0.1" min="0" inputmode="decimal" id="fBerat" value="${esc(d.berat)}"></div>
    </div>
    <div class="field"><label for="fHarga">Harga Rp (opsional)</label><input type="number" min="0" step="500" inputmode="numeric" id="fHarga" value="${esc(d.harga)}"></div>
    <div class="field"><label for="fCat">Catatan (opsional)</label><textarea id="fCat" placeholder="mis. Paket express, setrika saja untuk kemeja">${esc(d.catatan)}</textarea></div>
    <button class="btn primary" id="fSave">${isNew?"Simpan & catat baju":"Simpan"}</button>`,()=>{
      $("#fSave").onclick=()=>{
        const nb=b?b:{id:uid(),items:[],dibuat:Date.now()};
        nb.laundry=$("#fLaundry").value.trim()||"Laundry";
        nb.tglAntar=$("#fAntar").value;nb.tglAmbil=$("#fAmbil").value;
        nb.nota=$("#fNota").value.trim();nb.berat=$("#fBerat").value;nb.harga=$("#fHarga").value;
        nb.catatan=$("#fCat").value.trim();
        sheetOpen=false;$("#overlay").innerHTML="";
        ui.view="batch";ui.id=nb.id;if(isNew)ui.tab="catatan";
        saveBatch(nb);
        if(isNew)setTimeout(()=>openItemSheet(nb,null),50);
      };
    });
}

let pickCb=null;
$("#fileIn").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";pickCb&&pickCb(f)});
$("#fileInGallery").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";pickCb&&pickCb(f)});

function openItemSheet(b,it){
  const isNew=!it;
  const d=it?JSON.parse(JSON.stringify(it)):{id:uid(),jenis:"",warna:"",jumlah:1,catatan:"",foto:[],cek:null};
  const removed=[];let uploading=0;
  const draw=()=>{
    const ph=$("#phs");if(!ph)return;
    ph.innerHTML=d.foto.map((r,i)=>{const s=photoSrc(r);return `<div class="ph">${s?`<img src="${esc(s)}" alt="Foto ${i+1}">`:""}<button data-rm="${i}" aria-label="Hapus foto ${i+1}">✕</button></div>`}).join("")
      +Array.from({length:uploading},()=>`<div class="ph loading"></div>`).join("")
      +`<button class="addph" id="addCam">${ICON.cam}Kamera</button><button class="addph" id="addGal">${ICON.img}Galeri</button>`;
    ph.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{removed.push(...d.foto.splice(+x.dataset.rm,1));draw()});
    $("#addCam").onclick=()=>{pickCb=handle;$("#fileIn").click()};
    $("#addGal").onclick=()=>{pickCb=handle;$("#fileInGallery").click()};
    const sv=$("#iSave");if(sv)sv.disabled=uploading>0;
  };
  async function handle(files){
    for(const f of files){
      uploading++;draw();
      try{d.foto.push(await savePhoto(f))}
      catch(e){toast("Foto gagal disimpan: "+(e&&e.code==="quota_exceeded"?"kuota penyimpanan penuh":(e&&e.message||"coba lagi")))}
      finally{uploading--;draw()}
    }
  }
  openSheet(`<div class="sh"><h2>${isNew?"Tambah baju":"Ubah baju"}</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="field"><label>Foto</label><div class="photos" id="phs"></div></div>
    <div class="field"><label for="iJenis">Jenis</label>
      <div class="presets" id="presets">${JENIS.map(j=>`<button type="button" class="${d.jenis===j?"on":""}">${esc(j)}</button>`).join("")}</div>
      <input type="text" id="iJenis" value="${esc(d.jenis)}" placeholder="atau ketik sendiri">
    </div>
    <div class="field"><label for="iWarna">Warna / merek / ciri</label><input type="text" id="iWarna" value="${esc(d.warna)}" placeholder="mis. Biru dongker, merek Uniqlo, ada logo di dada"></div>
    <div class="field"><label for="iJml">Jumlah</label><div class="stepper"><button type="button" id="iMin" aria-label="Kurangi">−</button><input type="number" min="1" inputmode="numeric" id="iJml" value="${esc(d.jumlah||1)}"><button type="button" id="iPlus" aria-label="Tambah">+</button><span class="muted">pcs</span></div></div>
    <div class="field"><label for="iCat">Kondisi sebelum dicuci</label><textarea id="iCat" placeholder="mis. Noda kopi di lengan kanan, kancing kedua longgar">${esc(d.catatan)}</textarea></div>
    <div class="actions" style="margin:0">
      <button class="btn primary" id="iSave">${isNew?"Simpan baju":"Simpan perubahan"}</button>
      ${isNew?`<button class="btn" id="iSaveNext">${ICON.plus}Tambah lagi</button>`:`<button class="btn danger" id="iDel">Hapus baju</button>`}
    </div>`,()=>{
      draw();
      document.querySelectorAll("#presets button").forEach(x=>x.onclick=()=>{
        document.querySelectorAll("#presets button").forEach(y=>y.classList.remove("on"));x.classList.add("on");$("#iJenis").value=x.textContent});
      $("#iJenis").oninput=()=>document.querySelectorAll("#presets button").forEach(y=>y.classList.toggle("on",y.textContent===$("#iJenis").value));
      $("#iMin").onclick=()=>{$("#iJml").value=Math.max(1,(+$("#iJml").value||1)-1)};
      $("#iPlus").onclick=()=>{$("#iJml").value=(+$("#iJml").value||0)+1};
      const commit=(next)=>{
        if(uploading)return;
        d.jenis=$("#iJenis").value.trim()||"Pakaian";d.warna=$("#iWarna").value.trim();
        d.jumlah=Math.max(1,parseInt($("#iJml").value,10)||1);d.catatan=$("#iCat").value.trim();
        const i=b.items.findIndex(x=>x.id===d.id);if(i<0)b.items.push(d);else b.items[i]=d;
        removed.forEach(deletePhoto);
        sheetOpen=false;$("#overlay").innerHTML="";ui.tab="catatan";
        saveBatch(b);
        if(next)setTimeout(()=>openItemSheet(b,null),30);else toast("Baju dicatat");
      };
      $("#iSave").onclick=()=>commit(false);
      const nx=$("#iSaveNext");if(nx)nx.onclick=()=>commit(true);
      const del=$("#iDel");if(del)del.onclick=()=>{
        del.outerHTML=`<button class="btn danger" id="iDelYes">Yakin hapus?</button>`;
        $("#iDelYes").onclick=()=>{b.items=b.items.filter(x=>x.id!==d.id);(it.foto||[]).forEach(deletePhoto);sheetOpen=false;$("#overlay").innerHTML="";saveBatch(b)};
      };
    });
}
function openIssueSheet(b,it){
  openSheet(`<div class="sh"><h2>Ada masalah: ${esc(it.jenis)}</h2><button class="btn ghost" data-close>Batal</button></div>
    <div class="field"><label for="kJml">Jumlah yang kembali (dari ${esc(it.jumlah||1)})</label><input type="number" min="0" inputmode="numeric" id="kJml" value="${esc(it.cekJumlah??"")}" placeholder="mis. 2"></div>
    <div class="field"><label>Masalah</label><div class="presets" id="kPre">${["Hilang","Tertukar","Luntur","Robek","Noda belum hilang","Masih bau","Kancing lepas","Menyusut"].map(x=>`<button type="button">${x}</button>`).join("")}</div></div>
    <div class="field"><label for="kCat">Keterangan</label><textarea id="kCat" placeholder="mis. Kemeja putih berubah jadi kebiruan">${esc(it.cekCatatan||"")}</textarea></div>
    <button class="btn danger" id="kSave">Tandai bermasalah</button>`,()=>{
      document.querySelectorAll("#kPre button").forEach(x=>x.onclick=()=>{const t=$("#kCat");t.value=t.value?(t.value.replace(/\s+$/,"")+", "+x.textContent.toLowerCase()):x.textContent});
      $("#kSave").onclick=()=>{
        it.cek="masalah";const v=$("#kJml").value;it.cekJumlah=v===""?null:Math.max(0,parseInt(v,10)||0);
        it.cekCatatan=$("#kCat").value.trim();sheetOpen=false;$("#overlay").innerHTML="";saveBatch(b);
      };
    });
}
function lightbox(refs,i){
  const ov=$("#overlay");
  const show=()=>{const s=photoSrc(refs[i]);
    ov.innerHTML=`<div class="lightbox" role="dialog" aria-label="Foto">${s?`<img src="${esc(s)}" alt="Foto ${i+1} dari ${refs.length}">`:""}<button class="btn">Tutup</button></div>`;
    const lb=ov.firstElementChild;
    lb.onclick=e=>{if(e.target.tagName==="IMG"&&refs.length>1){i=(i+1)%refs.length;show()}else{ov.innerHTML=""}};
  };show();
}
/* ---------- Cadangkan & pulihkan ---------- */
const LB_KEY="cekcucian.lastBackup";
function lastBackup(){try{return Number(localStorage.getItem(LB_KEY))||0}catch(e){return 0}}
function daysSince(t){return Math.max(1,Math.floor((Date.now()-t)/864e5))}
function backupDue(){const t=lastBackup();return !t||Date.now()-t>7*864e5}
function fmtDateTime(t){return new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
async function buildBackup(){
  const foto={};let n=0;
  for(const b of store.batches)for(const it of b.items||[])for(const r of it.foto||[]){
    if(r.i&&!foto[r.i]){const blob=await idbDo("readonly",s=>s.get(r.i));if(blob){foto[r.i]=await blobToDataURL(blob);n++}}
  }
  const data={app:"cek-cucian",versi:1,dibuat:new Date().toISOString(),kiriman:store.batches,foto};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const name="cek-cucian-cadangan-"+today()+".json";
  return {blob,name,file:new File([blob],name,{type:"application/json"}),nFoto:n};
}
const sizeTxt=b=>b>1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";
function markBackedUp(){try{localStorage.setItem(LB_KEY,String(Date.now()))}catch(e){}}
async function openBackupSheet(){
  openSheet(`<div class="sh"><h2>Cadangkan data</h2><button class="btn ghost" data-close>Tutup</button></div><p class="muted" id="bkInfo" style="margin:0">Menyiapkan file cadangan…</p><div class="actions" id="bkAct" style="margin:0"></div>`);
  let bk;
  try{bk=await buildBackup()}catch(e){$("#bkInfo").textContent="Gagal menyiapkan cadangan: "+(e&&e.message||"coba lagi");return}
  if(!$("#bkInfo"))return;
  const c=store.batches.length;
  $("#bkInfo").innerHTML=`<b>${c} kiriman, ${bk.nFoto} foto</b> · ukuran ${esc(sizeTxt(bk.blob.size))}<br>Nama file: <span class="mono">${esc(bk.name)}</span><br><br>Pilih <b>Bagikan</b> untuk menyimpan ke Google Drive atau mengirim ke WhatsApp sendiri. Pilih <b>Unduh</b> untuk menyimpan ke folder Download.`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[bk.file]}));
  $("#bkAct").innerHTML=(canShare?`<button class="btn primary" id="bkShare">${ICON.share}Bagikan ke Drive / WhatsApp</button>`:"")+`<button class="btn ${canShare?"":"primary"}" id="bkDl">${ICON.save}Unduh file</button>`;
  if(canShare)$("#bkShare").onclick=async()=>{
    try{await navigator.share({files:[bk.file],title:"Cadangan Cek Cucian",text:"File cadangan Cek Cucian "+today()});markBackedUp();closeSheet();toast("Cadangan dibagikan")}
    catch(e){if(e&&e.name!=="AbortError")toast("Gagal membagikan. Coba Unduh file.")}
  };
  $("#bkDl").onclick=()=>{
    const url=URL.createObjectURL(bk.blob);const a=document.createElement("a");a.href=url;a.download=bk.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);markBackedUp();closeSheet();toast("File cadangan diunduh ke folder Download");
  };
}
$("#restoreIn").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;
  try{data=JSON.parse(await f.text())}catch(err){toast("File tidak bisa dibaca. Pilih file .json cadangan Cek Cucian.");return}
  if(!data||data.app!=="cek-cucian"||!Array.isArray(data.kiriman)){toast("Ini bukan file cadangan Cek Cucian.");return}
  const ada=new Map(store.batches.map(b=>[b.id,b]));
  let baru=0,diperbarui=0,sama=0;
  for(const b of data.kiriman){const lama=ada.get(b.id);if(!lama)baru++;else if((b.diubah||0)>(lama.diubah||0))diperbarui++;else sama++}
  openSheet(`<div class="sh"><h2>Pulihkan data</h2><button class="btn ghost" data-close>Batal</button></div>
    <p style="margin:0">File dibuat <b>${esc(data.dibuat?fmtDateTime(Date.parse(data.dibuat)):"–")}</b>, berisi ${data.kiriman.length} kiriman dan ${Object.keys(data.foto||{}).length} foto.</p>
    <ul class="muted" style="margin:0;padding-left:20px"><li>${baru} kiriman baru akan ditambahkan</li><li>${diperbarui} kiriman akan diganti dengan versi yang lebih baru dari file</li><li>${sama} kiriman sudah ada dan tidak diubah</li></ul>
    <p class="muted" style="margin:0">Data lain yang sudah ada di HP ini tetap aman.</p>
    <button class="btn primary" id="rsGo">${ICON.upload}Pulihkan</button>`,()=>{
      $("#rsGo").onclick=async()=>{
        const btn=$("#rsGo");btn.disabled=true;btn.textContent="Memulihkan…";
        try{
          for(const [id,u] of Object.entries(data.foto||{})){
            if(typeof u!=="string"||!u.startsWith("data:image/"))continue;
            const blob=await (await fetch(u)).blob();
            await idbDo("readwrite",s=>s.put(blob,id));
            store.photoCache.delete("i:"+id);
          }
          for(const b of data.kiriman){
            if(!b||typeof b.id!=="string")continue;
            const lama=ada.get(b.id);
            if(!lama)store.batches.push(b);
            else if((b.diubah||0)>(lama.diubah||0))store.batches[store.batches.indexOf(lama)]=b;
          }
          store.batches.sort((a,b)=>(b.tglAntar||"").localeCompare(a.tglAntar||"")||(b.dibuat||0)-(a.dibuat||0));
          if(lsWrite()){closeSheet();toast(`Dipulihkan: ${baru} kiriman baru, ${diperbarui} diperbarui`)}
        }catch(err){toast("Gagal memulihkan: "+(err&&err.message||"coba lagi"));btn.disabled=false;btn.textContent="Pulihkan"}
      };
    });
});
let tt;function toast(m){clearTimeout(tt);let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2600)}

render();boot();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
